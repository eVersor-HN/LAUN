<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUNCHER — 20 New Tile Animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-head:'Chakra Petch','Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --bg:#000000; --bg2:#0d0d0d; --fg:#ffffff; --dim:#666666; --dim2:#3a3a3a; --accent:#ffffff; --border:#2a2a2a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-head);
    overflow:hidden; -webkit-font-smoothing:antialiased; perspective:1100px;
  }
  .texture{ position:fixed; inset:0; pointer-events:none; z-index:1; background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,.6) 100%); }

  .tag{ position:fixed; top:18px; left:20px; z-index:5; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; color:var(--dim); }
  .tag b{ color:var(--fg); }

  .stage{ position:fixed; inset:0; z-index:2; cursor:pointer; }
  .hint{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase;
    transition:opacity .3s ease; pointer-events:none;
  }
  .hint::after{ content:'_'; color:var(--accent); animation:blink 1s step-end infinite; margin-left:4px; }
  .stage.is-open .hint{ opacity:0; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .hexfield{ position:absolute; inset:0; }
  .hex{ position:absolute; transform-style:preserve-3d; }
  .hex-face{
    position:relative; width:100%; height:100%;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--border); cursor:default; opacity:0; overflow:hidden;
  }
  .hex-inner{
    position:absolute; inset:2px;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--bg2); overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .hex-face .idx{ font-family:var(--font-mono); font-size:8px; color:var(--dim); letter-spacing:.6px; position:relative; z-index:2; }
  .hex-face .name{ font-family:var(--font-head); font-size:9.5px; font-weight:600; color:var(--fg); text-transform:uppercase; position:relative; z-index:2; }

  .fx{ position:absolute; inset:0; pointer-events:none; }

  /* ===== panel ===== */
  .panel{
    position:fixed; bottom:16px; left:16px; right:16px; z-index:20; max-height:44vh;
    background:rgba(13,13,13,.94); backdrop-filter:blur(8px); border:1px solid var(--border);
    padding:12px 14px; font-family:var(--font-mono); overflow-y:auto;
  }
  .panel h1{ margin:0 0 8px; font-size:10px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; font-weight:600; }
  .anims{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  @media (max-width:760px){ .anims{ grid-template-columns:repeat(2,1fr); } }
  .anim-btn{
    padding:8px 6px; background:transparent; border:1px solid var(--border); color:var(--dim);
    font-family:var(--font-mono); font-size:9px; letter-spacing:.02em; cursor:pointer; text-align:left; line-height:1.3;
  }
  .anim-btn b{ display:block; color:var(--dim); font-size:10px; margin-bottom:1px; }
  .anim-btn.active{ border-color:var(--accent); color:var(--fg); background:rgba(255,255,255,.06); }
  .anim-btn.active b{ color:var(--fg); }

  .stage.is-open .hex-face{ animation-duration:var(--dur,560ms); animation-delay:var(--delay,0ms); animation-fill-mode:both; }
  .stage.closing .hex-face{ animation-duration:300ms; animation-delay:var(--close-delay,0ms); animation-fill-mode:both; }
  .stage:not(.is-open):not(.closing) .hex-face{ opacity:0; animation:none !important; }
  .stage.is-open .hex-inner, .stage.closing .hex-inner{ animation-fill-mode:both; }
  .stage.is-open .fx, .stage.closing .fx{ animation-fill-mode:both; }

  /* ============================================================ 20 ANIMATIONS ============================================================ */

  /* 1. DATA RAIN ASSEMBLE */
  @keyframes a1-open{ 0%{opacity:0; transform:scale(.9);} 100%{opacity:1; transform:scale(.9);} }
  @keyframes a1-close{ 0%{opacity:1; transform:scale(.9);} 100%{opacity:0; transform:scale(.9);} }
  @keyframes a1-rain{ from{ background-position-y:0; } to{ background-position-y:120px; } }
  @keyframes a1-rain-fade{ 0%{opacity:.9;} 70%{opacity:.5;} 100%{opacity:0;} }
  .stage.is-open[data-anim="1"] .hex-face{ animation-name:a1-open; animation-timing-function:steps(6,end); }
  .stage.closing[data-anim="1"] .hex-face{ animation-name:a1-close; animation-timing-function:ease-in; }
  [data-anim="1"] .hex-face .fx{
    background:repeating-linear-gradient(180deg, transparent 0 3px, rgba(255,255,255,.55) 3px 5px);
    background-size:100% 24px; mix-blend-mode:screen;
  }
  .stage.is-open[data-anim="1"] .fx{ animation:a1-rain 420ms linear both, a1-rain-fade var(--dur,560ms) ease-out both; animation-delay:var(--delay,0ms); }
  .stage.closing[data-anim="1"] .fx{ animation:a1-rain 300ms linear reverse both; animation-delay:var(--close-delay,0ms); }

  /* 2. HOLO STACK BUILD */
  @keyframes a2-open{ from{opacity:0; clip-path:inset(100% 0 0 0);} to{opacity:1; clip-path:inset(0 0 0 0);} }
  @keyframes a2-close{ from{opacity:1; clip-path:inset(0 0 0 0);} to{opacity:0; clip-path:inset(0 0 100% 0);} }
  @keyframes a2-fringe{ 0%{opacity:.8;} 100%{opacity:0;} }
  .stage.is-open[data-anim="2"] .hex-face{ animation-name:a2-open; animation-timing-function:steps(9,end); }
  .stage.closing[data-anim="2"] .hex-face{ animation-name:a2-close; animation-timing-function:steps(7,end); }
  [data-anim="2"] .hex-face .fx::before, [data-anim="2"] .hex-face .fx::after{
    content:''; position:absolute; inset:0; clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  [data-anim="2"] .hex-face .fx::before{ background:rgba(255,0,80,.35); transform:translateX(-3px); mix-blend-mode:screen; }
  [data-anim="2"] .hex-face .fx::after{ background:rgba(0,200,255,.35); transform:translateX(3px); mix-blend-mode:screen; }
  .stage.is-open[data-anim="2"] .fx{ animation:a2-fringe 260ms linear both; animation-delay:var(--delay,0ms); }

  /* 3. APERTURE SHUTTER */
  @keyframes a3-open{ from{opacity:0; clip-path:circle(0% at 50% 50%); transform:scale(.9) rotate(-25deg);} to{opacity:1; clip-path:circle(75% at 50% 50%); transform:scale(.9) rotate(0deg);} }
  @keyframes a3-close{ from{opacity:1; clip-path:circle(75% at 50% 50%); transform:scale(.9) rotate(0deg);} to{opacity:0; clip-path:circle(0% at 50% 50%); transform:scale(.9) rotate(20deg);} }
  .stage.is-open[data-anim="3"] .hex-face{ animation-name:a3-open; animation-timing-function:cubic-bezier(.2,.8,.3,1); }
  .stage.closing[data-anim="3"] .hex-face{ animation-name:a3-close; animation-timing-function:cubic-bezier(.6,0,.9,0); }

  /* 4. VOLTAGE SURGE */
  @keyframes a4-open{ 0%{opacity:0; transform:scale(.75); filter:brightness(1);} 8%{opacity:1; transform:scale(.95); filter:brightness(4);} 22%{filter:brightness(1.1);} 40%{filter:brightness(2.6);} 60%{filter:brightness(1);} 100%{opacity:1; transform:scale(.9); filter:brightness(1);} }
  @keyframes a4-close{ 0%{opacity:1; filter:brightness(1); transform:scale(.9);} 25%{filter:brightness(3);} 100%{opacity:0; filter:brightness(1); transform:scale(.7);} }
  .stage.is-open[data-anim="4"] .hex-face{ animation-name:a4-open; animation-timing-function:linear; }
  .stage.closing[data-anim="4"] .hex-face{ animation-name:a4-close; animation-timing-function:ease-in; }

  /* 5. RACK FOCUS */
  @keyframes a5-open{ from{opacity:0; transform:scale(1.6); filter:blur(14px);} to{opacity:1; transform:scale(.9); filter:blur(0);} }
  @keyframes a5-close{ from{opacity:1; transform:scale(.9); filter:blur(0);} to{opacity:0; transform:scale(1.3); filter:blur(10px);} }
  .stage.is-open[data-anim="5"] .hex-face{ animation-name:a5-open; animation-timing-function:cubic-bezier(.16,1,.3,1); }
  .stage.closing[data-anim="5"] .hex-face{ animation-name:a5-close; animation-timing-function:ease-in; }

  /* 6. SIGNAL LOCK-ON */
  @keyframes a6-tile-open{ 0%{opacity:0; transform:scale(.9);} 55%{opacity:0;} 56%{opacity:1;} 100%{opacity:1; transform:scale(.9);} }
  @keyframes a6-tile-close{ 0%{opacity:1;} 100%{opacity:0;} }
  @keyframes a6-reticle{ 0%{opacity:0; transform:scale(2.4) rotate(0deg);} 50%{opacity:1; transform:scale(1.05) rotate(45deg);} 65%{opacity:1; transform:scale(1) rotate(90deg);} 100%{opacity:0; transform:scale(.96) rotate(90deg);} }
  .stage.is-open[data-anim="6"] .hex-face{ animation-name:a6-tile-open; animation-timing-function:steps(2,jump-none); }
  .stage.closing[data-anim="6"] .hex-face{ animation-name:a6-tile-close; animation-timing-function:ease-in; animation-duration:150ms; }
  [data-anim="6"] .hex-face .fx{ border:1.5px solid var(--fg); box-sizing:border-box; }
  [data-anim="6"] .hex-face .fx::before, [data-anim="6"] .hex-face .fx::after{ content:''; position:absolute; background:var(--fg); }
  [data-anim="6"] .hex-face .fx::before{ top:50%; left:0; right:0; height:1px; transform:translateY(-.5px); }
  [data-anim="6"] .hex-face .fx::after{ left:50%; top:0; bottom:0; width:1px; transform:translateX(-.5px); }
  .stage.is-open[data-anim="6"] .fx{ animation:a6-reticle var(--dur,560ms) ease-out both; animation-delay:var(--delay,0ms); }

  /* 7. DATA PACKET PING */
  @keyframes a7-open{ from{opacity:0; transform:scale(.5);} 60%{transform:scale(1);} to{opacity:1; transform:scale(.9);} }
  @keyframes a7-close{ from{opacity:1; transform:scale(.9);} to{opacity:0; transform:scale(.5);} }
  @keyframes a7-ping{ 0%{box-shadow:0 0 0 0 rgba(255,255,255,.9);} 100%{box-shadow:0 0 0 22px rgba(255,255,255,0);} }
  .stage.is-open[data-anim="7"] .hex-face{ animation-name:a7-open; animation-timing-function:cubic-bezier(.34,1.4,.64,1); }
  .stage.closing[data-anim="7"] .hex-face{ animation-name:a7-close; animation-timing-function:ease-in; }
  [data-anim="7"] .hex-face .fx::before{ content:''; position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:var(--fg); }
  .stage.is-open[data-anim="7"] .fx::before{ animation:a7-ping 380ms ease-out both; animation-delay:var(--delay,0ms); }

  /* 8. ENCODE BARS */
  @keyframes a8-open{ from{opacity:0;} to{opacity:1;} }
  @keyframes a8-close{ from{opacity:1;} to{opacity:0;} }
  .stage.is-open[data-anim="8"] .hex-face{ animation-name:a8-open; animation-timing-function:linear; animation-duration:60ms; }
  .stage.closing[data-anim="8"] .hex-face{ animation-name:a8-close; animation-timing-function:linear; animation-duration:60ms; animation-delay:calc(var(--close-delay,0ms) + 220ms); }
  [data-anim="8"] .bar{ position:absolute; top:0; bottom:0; width:16.6%; background:var(--border); opacity:0; }
  @keyframes a8-bar-up{ from{opacity:0; transform:translateY(-100%);} to{opacity:1; transform:translateY(0);} }
  @keyframes a8-bar-down{ from{opacity:0; transform:translateY(100%);} to{opacity:1; transform:translateY(0);} }
  .stage.is-open[data-anim="8"] .bar{ animation-duration:260ms; animation-timing-function:cubic-bezier(.2,.9,.3,1); animation-fill-mode:both; }
  .stage.is-open[data-anim="8"] .bar:nth-child(odd){ animation-name:a8-bar-up; }
  .stage.is-open[data-anim="8"] .bar:nth-child(even){ animation-name:a8-bar-down; }

  /* 9. THERMAL BLOOM */
  @keyframes a9-open{ 0%{opacity:0; filter:blur(10px) brightness(3); transform:scale(1.1);} 60%{filter:blur(3px) brightness(1.8);} 100%{opacity:1; filter:blur(0) brightness(1); transform:scale(.9);} }
  @keyframes a9-close{ 0%{opacity:1; filter:blur(0) brightness(1); transform:scale(.9);} 100%{opacity:0; filter:blur(8px) brightness(2.4); transform:scale(1.05);} }
  .stage.is-open[data-anim="9"] .hex-face{ animation-name:a9-open; animation-timing-function:ease-out; }
  .stage.closing[data-anim="9"] .hex-face{ animation-name:a9-close; animation-timing-function:ease-in; }

  /* 10. QUANTUM FLICKER */
  @keyframes a10-open{ 0%{opacity:0;} 12%{opacity:.8;} 20%{opacity:0;} 34%{opacity:.6;} 42%{opacity:.1;} 58%{opacity:1;} 66%{opacity:.3;} 80%{opacity:1;} 100%{opacity:1;} }
  @keyframes a10-close{ 0%{opacity:1;} 20%{opacity:.2;} 40%{opacity:.8;} 55%{opacity:.1;} 100%{opacity:0;} }
  .stage.is-open[data-anim="10"] .hex-face{ animation-name:a10-open; animation-timing-function:steps(1,jump-end); transform:scale(.9); }
  .stage.closing[data-anim="10"] .hex-face{ animation-name:a10-close; animation-timing-function:steps(1,jump-end); transform:scale(.9); }

  /* 11. SERVO LOCK ROTATE */
  @keyframes a11-open{ 0%{opacity:0; transform:scale(.9) rotate(160deg);} 70%{opacity:1; transform:scale(.9) rotate(-8deg);} 100%{opacity:1; transform:scale(.9) rotate(0deg);} }
  @keyframes a11-close{ 0%{opacity:1; transform:scale(.9) rotate(0deg);} 100%{opacity:0; transform:scale(.9) rotate(-140deg);} }
  .stage.is-open[data-anim="11"] .hex-face{ animation-name:a11-open; animation-timing-function:cubic-bezier(.2,.9,.3,1.1); }
  .stage.closing[data-anim="11"] .hex-face{ animation-name:a11-close; animation-timing-function:ease-in; }

  /* 12. CORROSION BLEED */
  @keyframes a12-open{ from{opacity:0; clip-path:polygon(50% 45%,52% 45%,52% 55%,50% 55%);} to{opacity:1; clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);} }
  @keyframes a12-close{ from{opacity:1; clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);} to{opacity:0; clip-path:polygon(48% 48%,52% 46%,53% 53%,47% 52%);} }
  .stage.is-open[data-anim="12"] .hex-face{ animation-name:a12-open; animation-timing-function:cubic-bezier(.3,.6,.2,1); transform:scale(.9); }
  .stage.closing[data-anim="12"] .hex-face{ animation-name:a12-close; animation-timing-function:ease-in; transform:scale(.9); }

  /* 13. LASER ETCH OUTLINE */
  @keyframes a13-open{ 0%{opacity:0;} 1%{opacity:1;} 100%{opacity:1;} }
  @keyframes a13-close{ from{opacity:1;} to{opacity:0;} }
  @keyframes a13-sweep{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes a13-fill{ from{opacity:0;} to{opacity:1;} }
  .stage.is-open[data-anim="13"] .hex-face{ animation-name:a13-open; transform:scale(.9); }
  .stage.closing[data-anim="13"] .hex-face{ animation-name:a13-close; transform:scale(.9); animation-timing-function:ease-in; }
  [data-anim="13"] .hex-inner{ opacity:0; }
  .stage.is-open[data-anim="13"] .hex-inner{ animation:a13-fill 120ms linear both; animation-delay:calc(var(--delay,0ms) + 340ms); }
  .stage.closing[data-anim="13"] .hex-inner{ animation:a13-fill 100ms linear reverse both; animation-delay:var(--close-delay,0ms); }
  [data-anim="13"] .hex-face .fx{ background:conic-gradient(from 0deg, transparent 0deg, transparent 320deg, #fff 340deg, #fff 360deg); }
  .stage.is-open[data-anim="13"] .fx{ animation:a13-sweep 340ms linear both; animation-delay:var(--delay,0ms); }

  /* 14. CASCADE STACK */
  @keyframes a14-open{ 0%{opacity:0; transform:scale(1.7) translateY(-14px);} 40%{opacity:.5;} 100%{opacity:1; transform:scale(.9) translateY(0);} }
  @keyframes a14-close{ 0%{opacity:1; transform:scale(.9) translateY(0);} 100%{opacity:0; transform:scale(1.5) translateY(10px);} }
  .stage.is-open[data-anim="14"] .hex-face{ animation-name:a14-open; animation-timing-function:cubic-bezier(.16,1,.3,1); }
  .stage.closing[data-anim="14"] .hex-face{ animation-name:a14-close; animation-timing-function:ease-in; }
  [data-anim="14"] .hex-face .fx{ background:rgba(255,255,255,.5); }
  .stage.is-open[data-anim="14"] .fx{ animation:a14-open 300ms cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--delay,0ms) - 60ms); opacity:.4; }

  /* 15. NEIGHBOR RIPPLE */
  @keyframes a15-open{ 0%{opacity:0; transform:scale(.9);} 55%{opacity:1; transform:scale(.98);} 70%{transform:scale(.86);} 100%{opacity:1; transform:scale(.9);} }
  @keyframes a15-close{ from{opacity:1; transform:scale(.9);} to{opacity:0; transform:scale(1.02);} }
  .stage.is-open[data-anim="15"] .hex-face{ animation-name:a15-open; animation-timing-function:ease-out; }
  .stage.closing[data-anim="15"] .hex-face{ animation-name:a15-close; animation-timing-function:ease-in; }

  /* 16. STATIC DISCHARGE (close-focused, open is a quick simple fade) */
  @keyframes a16-open{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(.9);} }
  @keyframes a16-close{ 0%{opacity:1; transform:scale(.9) translate(0,0);} 15%{opacity:.3; transform:scale(.9) translate(3px,-2px);} 30%{opacity:.8; transform:scale(.9) translate(-3px,2px);} 45%{opacity:.15; transform:scale(.85) translate(2px,1px);} 60%{opacity:.6; transform:scale(.95) translate(-2px,-2px);} 100%{opacity:0; transform:scale(.7) translate(4px,3px);} }
  .stage.is-open[data-anim="16"] .hex-face{ animation-name:a16-open; animation-timing-function:steps(4,end); }
  .stage.closing[data-anim="16"] .hex-face{ animation-name:a16-close; animation-timing-function:steps(8,end); filter:contrast(1.6) saturate(0); }

  /* 17. GYROSCOPIC TUMBLE */
  @keyframes a17-open{ from{opacity:0; transform:scale(.9) rotateX(70deg) rotateY(-50deg);} to{opacity:1; transform:scale(.9) rotateX(0) rotateY(0);} }
  @keyframes a17-close{ from{opacity:1; transform:scale(.9) rotateX(0) rotateY(0);} to{opacity:0; transform:scale(.9) rotateX(-60deg) rotateY(60deg);} }
  .stage.is-open[data-anim="17"] .hex-face{ animation-name:a17-open; animation-timing-function:cubic-bezier(.2,.8,.3,1); }
  .stage.closing[data-anim="17"] .hex-face{ animation-name:a17-close; animation-timing-function:ease-in; }

  /* 18. PARTICLE CONDENSATION */
  @keyframes a18-open{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(.9);} }
  @keyframes a18-close{ from{opacity:1; transform:scale(.9);} to{opacity:0; transform:scale(.9);} }
  @keyframes a18-particles{ from{ background-size:3px 3px; opacity:1; filter:blur(0); } to{ background-size:120px 120px; opacity:0; filter:blur(2px); } }
  .stage.is-open[data-anim="18"] .hex-face{ animation-name:a18-open; animation-timing-function:linear; animation-duration:80ms; animation-delay:calc(var(--delay,0ms) + 380ms); }
  .stage.closing[data-anim="18"] .hex-face{ animation-name:a18-close; animation-timing-function:linear; animation-duration:80ms; }
  [data-anim="18"] .hex-face .fx{
    background-image:radial-gradient(circle, #fff 1px, transparent 1.5px);
    background-position:50% 50%; background-repeat:space;
  }
  .stage.is-open[data-anim="18"] .fx{ animation:a18-particles 380ms cubic-bezier(.6,0,.4,1) reverse both; animation-delay:var(--delay,0ms); }
  .stage.closing[data-anim="18"] .fx{ animation:a18-particles 260ms ease-in both; animation-delay:var(--close-delay,0ms); }

  /* 19. WAVEFORM COLLAPSE */
  @keyframes a19-open{ from{opacity:0;} to{opacity:1;} }
  @keyframes a19-close{ from{opacity:1;} to{opacity:0;} }
  .stage.is-open[data-anim="19"] .hex-face{ animation-name:a19-open; animation-timing-function:linear; animation-duration:40ms; transform:scale(.9); }
  .stage.closing[data-anim="19"] .hex-face{ animation-name:a19-close; animation-timing-function:linear; animation-duration:40ms; animation-delay:calc(var(--close-delay,0ms) + 240ms); transform:scale(.9); }
  [data-anim="19"] .wavebar{ position:absolute; bottom:50%; width:9%; background:var(--fg); opacity:.85; transform-origin:bottom center; }
  @keyframes a19-bar{ from{ transform:scaleY(3); } to{ transform:scaleY(.18); } }
  .stage.is-open[data-anim="19"] .wavebar{ animation:a19-bar 260ms cubic-bezier(.3,.8,.3,1) both; }

  /* 20. PRISM SPLIT MERGE */
  @keyframes a20-open{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(.9);} }
  @keyframes a20-close{ from{opacity:1; transform:scale(.9);} to{opacity:0; transform:scale(.9);} }
  @keyframes a20-r{ from{ transform:translate(-14px,6px); opacity:.85; } to{ transform:translate(0,0); opacity:0; } }
  @keyframes a20-g{ from{ transform:translate(0,-10px); opacity:.85; } to{ transform:translate(0,0); opacity:0; } }
  @keyframes a20-b{ from{ transform:translate(14px,6px); opacity:.85; } to{ transform:translate(0,0); opacity:0; } }
  .stage.is-open[data-anim="20"] .hex-face{ animation-name:a20-open; animation-timing-function:ease-out; }
  .stage.closing[data-anim="20"] .hex-face{ animation-name:a20-close; animation-timing-function:ease-in; }
  [data-anim="20"] .hex-face .fx::before,[data-anim="20"] .hex-face .fx::after,[data-anim="20"] .hex-face .g{
    content:''; position:absolute; inset:0; clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); mix-blend-mode:screen;
  }
  [data-anim="20"] .hex-face .fx::before{ background:rgba(255,40,60,.8); }
  [data-anim="20"] .hex-face .fx::after{ background:rgba(60,140,255,.8); }
  [data-anim="20"] .hex-face .g{ background:rgba(60,255,140,.8); }
  .stage.is-open[data-anim="20"] .fx::before{ animation:a20-r 340ms ease-out both; animation-delay:var(--delay,0ms); }
  .stage.is-open[data-anim="20"] .fx::after{ animation:a20-b 340ms ease-out both; animation-delay:var(--delay,0ms); }
  .stage.is-open[data-anim="20"] .g{ animation:a20-g 340ms ease-out both; animation-delay:var(--delay,0ms); }
</style>
</head>
<body>

<div class="texture"></div>
<div class="tag">STYLE 07 — INK/WHITE<br>20 NEUE TILE-ANIMATIONEN</div>

<div class="stage" id="stage">
  <div class="hint">// tippen zum öffnen //</div>
  <div class="hexfield" id="hexfield"></div>
</div>

<div class="panel">
  <h1>Animation wählen (tippen = Vorschau öffnen / neu starten)</h1>
  <div class="anims" id="anims"></div>
</div>

<script>
(function(){
  var APPS = ['TERMINAL','VAULT','COMMS','NETSCAN','ARCHIVE','MEDIA','CIPHER','GRIDMAP','LEDGER','RELAY',
    'SENTRY','FORGE','CACHE','BEACON','PROXY','MODULE','ORACLE','NEXUS','DRIFT','ECHO','PULSE','VECTOR','ANCHOR','NULLSPC'];

  var ANIMS = [
    {n:1, name:'Data Rain Assemble', desc:'Fallende Code-Streifen setzen sich zusammen'},
    {n:2, name:'Holo Stack Build', desc:'Aufbau mit RGB-Fransen wie ein Hologramm'},
    {n:3, name:'Aperture Shutter', desc:'Kamera-Blende öffnet sich rotierend'},
    {n:4, name:'Voltage Surge', desc:'Stromstoß, dann Aufladen auf volle Helligkeit'},
    {n:5, name:'Rack Focus', desc:'Unscharf/groß fokussiert sich scharf'},
    {n:6, name:'Signal Lock-On', desc:'Zielfadenkreuz rastet ein, Kachel erscheint'},
    {n:7, name:'Data Packet Ping', desc:'Ping-Puls markiert den Auftreffpunkt'},
    {n:8, name:'Encode Bars', desc:'Vertikale Balken fahren ein und verschmelzen'},
    {n:9, name:'Thermal Bloom', desc:'Heißer Glow kühlt zu scharfem Bild ab'},
    {n:10, name:'Quantum Flicker', desc:'Unregelmäßiges Flackern kollabiert zu fest'},
    {n:11, name:'Servo Lock Rotate', desc:'Große Drehung mit mechanischem Einrasten'},
    {n:12, name:'Corrosion Bleed', desc:'Organisch wachsender, unregelmäßiger Rand'},
    {n:13, name:'Laser Etch Outline', desc:'Lichtpunkt zeichnet den Umriss, dann Füllung'},
    {n:14, name:'Cascade Stack', desc:'Geisterkopien stapeln sich in Position'},
    {n:15, name:'Neighbor Ripple', desc:'Erscheinen mit nachschwingendem Puls'},
    {n:16, name:'Static Discharge', desc:'Löst sich beim Schließen in Bildrauschen auf'},
    {n:17, name:'Gyroscopic Tumble', desc:'Taumelt um zwei Achsen in die Ebene'},
    {n:18, name:'Particle Condensation', desc:'Punktwolke verdichtet sich zur Fläche'},
    {n:19, name:'Waveform Collapse', desc:'Equalizer-Balken sacken zur Fläche zusammen'},
    {n:20, name:'Prism Split Merge', desc:'RGB-Geisterbilder laufen zusammen'}
  ];

  var stage = document.getElementById('stage');
  var hexfield = document.getElementById('hexfield');
  var isOpen = false;
  var hexEls = [];
  var currentAnim = 1;

  var animsEl = document.getElementById('anims');
  ANIMS.forEach(function(a){
    var b = document.createElement('div');
    b.className = 'anim-btn' + (a.n === currentAnim ? ' active' : '');
    b.innerHTML = '<b>' + String(a.n).padStart(2,'0') + ' · ' + a.name + '</b>' + a.desc;
    b.addEventListener('click', function(e){
      e.stopPropagation();
      currentAnim = a.n;
      Array.prototype.forEach.call(animsEl.children, function(el,i){ el.classList.toggle('active', ANIMS[i].n === a.n); });
      stage.setAttribute('data-anim', currentAnim);
      if (isOpen) replay(); else open();
    });
    animsEl.appendChild(b);
  });
  stage.setAttribute('data-anim', currentAnim);

  function buildHexes(){
    if (hexEls.length) return;
    APPS.forEach(function(name, i){
      var h = document.createElement('div');
      h.className = 'hex';
      var barsHtml = '';
      for (var k=0;k<6;k++) barsHtml += '<div class="bar" style="left:' + (k*16.6) + '%; animation-delay:calc(var(--delay,0ms) + ' + (k*22) + 'ms)"></div>';
      var wavesHtml = '';
      for (var w=0; w<7; w++) wavesHtml += '<div class="wavebar" style="left:' + (10+w*11) + '%; height:' + (30+ (w%3)*18) + 'px; animation-delay:calc(var(--delay,0ms) + ' + (w*18) + 'ms)"></div>';
      h.innerHTML = '<div class="hex-face">' +
          '<div class="fx"></div><div class="g"></div>' +
          '<div class="hex-inner">' +
            '<div class="idx">' + String(i+1).padStart(2,'0') + '</div>' +
            '<div class="name">' + name + '</div>' +
          '</div>' +
          barsHtml + wavesHtml +
        '</div>';
      hexfield.appendChild(h);
      hexEls.push(h);
    });
  }

  function layout(){
    var w = hexfield.clientWidth, h = hexfield.clientHeight;
    var margin = 24;
    var availW = Math.max(40, w - margin*2), availH = Math.max(40, h - margin*2);
    var n = hexEls.length;

    function capacity(hexW){
      var s = hexW/Math.sqrt(3), hexH = s*2;
      var cols = Math.max(1, Math.floor(availW/hexW));
      var rows = Math.max(1, Math.floor((availH-hexH*0.25)/(hexH*0.75))+1);
      return {cols:cols, rows:rows, hexH:hexH};
    }
    var hexW = 108, cap = capacity(hexW);
    while (cap.cols*cap.rows - Math.floor(cap.rows/2) < n && hexW > 40){ hexW -= 2; cap = capacity(hexW); }
    var cols = cap.cols, rows = cap.rows, hexH = cap.hexH;

    var cells = [];
    for (var row=0; row<rows; row++){
      var rowCols = row%2===0 ? cols : Math.max(0, cols-1);
      for (var col=0; col<rowCols; col++){
        cells.push({ x: col*hexW + (row%2===1 ? hexW/2 : 0), y: row*hexH*0.75 });
      }
    }
    var cx = cells.reduce(function(s,c){return s+c.x;},0)/cells.length;
    var cy = cells.reduce(function(s,c){return s+c.y;},0)/cells.length;
    var ranked = cells.map(function(c){ return {x:c.x, y:c.y, dx:c.x-cx, dy:c.y-cy}; })
      .sort(function(a,b){ return (a.dx*a.dx+a.dy*a.dy) - (b.dx*b.dx+b.dy*b.dy); })
      .slice(0, n);

    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    ranked.forEach(function(p){
      minX=Math.min(minX,p.dx-hexW/2); maxX=Math.max(maxX,p.dx+hexW/2);
      minY=Math.min(minY,p.dy-hexH/2); maxY=Math.max(maxY,p.dy+hexH/2);
    });
    var offsetX = w/2 - (minX+maxX)/2, offsetY = h/2 - (minY+maxY)/2;
    var maxDist = Math.max.apply(null, ranked.map(function(p){ return Math.hypot(p.dx,p.dy); })) || 1;

    hexEls.forEach(function(el, i){
      var p = ranked[i];
      el.style.width = hexW+'px'; el.style.height = hexH+'px';
      el.style.left = (offsetX+p.dx-hexW/2)+'px'; el.style.top = (offsetY+p.dy-hexH/2)+'px';
      var face = el.firstChild;
      var dist = Math.hypot(p.dx,p.dy);
      var baseDelay = (maxDist-dist)/maxDist*350 + (Math.random()*100-50);
      baseDelay = Math.max(0, baseDelay);
      face.style.setProperty('--delay', baseDelay.toFixed(0)+'ms');
      face.style.setProperty('--close-delay', (baseDelay/2).toFixed(0)+'ms');
      face.style.setProperty('--dur', (480+Math.random()*200).toFixed(0)+'ms');
    });
  }

  function open(){
    buildHexes(); layout();
    stage.classList.remove('closing');
    void stage.offsetWidth;
    stage.classList.add('is-open');
    isOpen = true;
  }
  function closeStage(){
    stage.classList.remove('is-open');
    stage.classList.add('closing');
    isOpen = false;
    setTimeout(function(){ stage.classList.remove('closing'); }, 900);
  }
  function replay(){
    stage.classList.remove('is-open','closing');
    void stage.offsetWidth;
    layout();
    stage.classList.add('is-open');
  }

  stage.addEventListener('click', function(e){
    if (!isOpen){ open(); }
    else if (!e.target.closest('.hex')){ closeStage(); }
  });
  window.addEventListener('resize', function(){ if (isOpen) layout(); });
})();
</script>
</body>
</html>
