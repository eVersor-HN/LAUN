<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUNCHER — 20 Wallpaper Animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-head:'Chakra Petch','Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --bg:#000000; --bg2:#0d0d0d; --fg:#ffffff; --dim:#666666; --dim2:#3a3a3a; --accent:#ffffff; --border:#2a2a2a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-head);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  .tag{ position:fixed; top:18px; left:20px; z-index:30; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; color:var(--dim); }
  .tag b{ color:var(--fg); }
  .tag .name{ display:block; margin-top:2px; font-size:9px; color:var(--dim2); }

  .stage{ position:fixed; inset:0; z-index:0; background:var(--bg); overflow:hidden; }
  #bgCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .layer{ position:absolute; inset:0; opacity:0; transition:opacity .5s ease; pointer-events:none; overflow:hidden; }

  /* ============================================================ HEX GRID PREVIEW OVERLAY ============================================================ */
  .hexOverlay{
    position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; align-content:center; gap:7px; pointer-events:none; padding-bottom:14vh;
  }
  .hexOverlay .hex{
    width:64px; height:74px;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    border:1px solid var(--border); background:rgba(13,13,13,.5); backdrop-filter:blur(.5px);
  }
  .hexOverlay .hex:nth-child(3n){ margin-top:37px; }

  /* ============================================================ PANEL ============================================================ */
  .panel{
    position:fixed; bottom:14px; left:14px; right:14px; z-index:40; max-height:42vh;
    background:rgba(13,13,13,.94); backdrop-filter:blur(8px); border:1px solid var(--border);
    padding:12px 14px; font-family:var(--font-mono); overflow-y:auto;
  }
  .panel h1{ margin:0 0 8px; font-size:10px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; font-weight:600; }
  .anims{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  @media (max-width:760px){ .anims{ grid-template-columns:repeat(2,1fr); } }
  .anim-btn{
    padding:8px 6px; background:transparent; border:1px solid var(--border); color:var(--dim);
    font-family:var(--font-mono); font-size:9px; letter-spacing:.02em; cursor:pointer; text-align:left; line-height:1.3;
  }
  .anim-btn b{ display:block; color:var(--dim); font-size:10px; margin-bottom:1px; }
  .anim-btn.active{ border-color:var(--accent); color:var(--fg); background:rgba(255,255,255,.06); }
  .anim-btn.active b{ color:var(--fg); }

  /* ============================================================ 2. SCAN GRID ============================================================ */
  .layer2{
    left:-50%; right:-50%; bottom:0; top:32%;
    background-image:
      linear-gradient(var(--fg) 1px, transparent 1px),
      linear-gradient(90deg, var(--fg) 1px, transparent 1px);
    background-size:46px 46px;
    transform:perspective(560px) rotateX(72deg);
    transform-origin:50% 100%;
    animation:scanGridScroll 2.2s linear infinite;
  }
  .stage[data-anim="2"] .layer2{ opacity:.3; }
  @keyframes scanGridScroll{ from{ background-position:0 0; } to{ background-position:0 46px; } }

  /* ============================================================ 3. DATA RAIN COLUMNS ============================================================ */
  .layer3{
    background:
      repeating-linear-gradient(180deg, transparent 0 3px, rgba(255,255,255,.6) 3px 5px),
      repeating-linear-gradient(90deg, transparent 0 25px, rgba(255,255,255,.06) 25px 26px);
    background-size:100% 30px, 100% 100%;
    animation:rainScroll 1.1s linear infinite;
    mix-blend-mode:screen;
  }
  .stage[data-anim="3"] .layer3{ opacity:.4; }
  @keyframes rainScroll{ from{ background-position:0 0,0 0; } to{ background-position:0 150px,0 0; } }

  /* ============================================================ 4. PULSE RADAR ============================================================ */
  .layer4{ display:flex; align-items:center; justify-content:center; }
  .layer4::before, .layer4::after{
    content:''; position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%;
    border:1px solid var(--fg); transform:translate(-50%,-50%); animation:radarPulse 2.6s ease-out infinite;
  }
  .layer4::after{ animation-delay:1.3s; }
  .layer4 .sweep{
    position:absolute; inset:0;
    background:conic-gradient(from 0deg, rgba(255,255,255,.22), transparent 28%, transparent 100%);
    animation:radarSweep 3.4s linear infinite;
  }
  .stage[data-anim="4"] .layer4{ opacity:.65; }
  @keyframes radarPulse{ 0%{ width:10px; height:10px; opacity:.6; } 100%{ width:64vmin; height:64vmin; opacity:0; } }
  @keyframes radarSweep{ to{ transform:rotate(360deg); } }

  /* ============================================================ 6. HEX LATTICE DRIFT ============================================================ */
  .layer6{
    background-image:
      linear-gradient(60deg, var(--fg) 1px, transparent 1px),
      linear-gradient(-60deg, var(--fg) 1px, transparent 1px),
      linear-gradient(var(--fg) 1px, transparent 1px);
    background-size:44px 76px, 44px 76px, 44px 76px;
    animation:hexDrift 16s linear infinite;
  }
  .stage[data-anim="6"] .layer6{ opacity:.16; }
  @keyframes hexDrift{ from{ background-position:0 0; } to{ background-position:88px 152px; } }

  /* ============================================================ 8. ORBIT NODES ============================================================ */
  .layer8{ display:flex; align-items:center; justify-content:center; }
  .layer8 .center{ position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px; background:var(--fg); border-radius:50%; }
  .layer8 .orbit{ position:absolute; top:50%; left:50%; border:1px solid var(--border); border-radius:50%; transform:translate(-50%,-50%); }
  .layer8 .orbit .dot{
    position:absolute; width:5px; height:5px; background:var(--fg); border-radius:50%;
    top:-2.5px; left:calc(50% - 2.5px); box-shadow:0 0 7px rgba(255,255,255,.8);
  }
  .layer8 .o1{ width:110px; height:110px; animation:orbitSpin 5s linear infinite; }
  .layer8 .o2{ width:210px; height:210px; animation:orbitSpin 9s linear infinite reverse; }
  .layer8 .o3{ width:320px; height:320px; animation:orbitSpin 14s linear infinite; }
  .stage[data-anim="8"] .layer8{ opacity:.7; }
  @keyframes orbitSpin{ from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }

  /* ============================================================ 10. WAVEFORM SCROLL ============================================================ */
  .layer10{ display:flex; align-items:center; }
  .layer10 .track{ display:flex; align-items:center; gap:5px; animation:waveScroll 9s linear infinite; }
  .layer10 .bar{ width:3px; background:var(--fg); animation:waveBounce 1.1s ease-in-out infinite alternate; }
  .stage[data-anim="10"] .layer10{ opacity:.4; }
  @keyframes waveScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @keyframes waveBounce{ from{ transform:scaleY(.2); } to{ transform:scaleY(1); } }

  /* ============================================================ 11. WARP TUNNEL ============================================================ */
  .layer11{ display:flex; align-items:center; justify-content:center; }
  .layer11 .warpwrap{ position:absolute; inset:-60%; animation:warpZoom 2.6s ease-in-out infinite alternate; }
  .layer11 .warpwrap::before{
    content:''; position:absolute; inset:0;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.18) 0deg 2deg, transparent 2deg 12deg);
    animation:warpSpin 7s linear infinite;
  }
  .stage[data-anim="11"] .layer11{ opacity:.55; }
  @keyframes warpZoom{ from{ transform:scale(1); } to{ transform:scale(1.4); } }
  @keyframes warpSpin{ to{ transform:rotate(360deg); } }

  /* ============================================================ 12. SERVER STATUS GRID ============================================================ */
  .layer12{ display:grid; grid-template-columns:repeat(16,1fr); grid-template-rows:repeat(10,1fr); gap:6px; padding:12%; }
  .layer12 .cell{ background:var(--border); }
  .layer12 .cell.on{ animation:cellFlicker 2.6s ease-in-out infinite; }
  .stage[data-anim="12"] .layer12{ opacity:.7; }
  @keyframes cellFlicker{ 0%,100%{ background:var(--border); } 50%{ background:var(--fg); box-shadow:0 0 6px rgba(255,255,255,.6); } }

  /* ============================================================ 14. LASER SWEEP ============================================================ */
  .layer14::before{
    content:''; position:absolute; left:0; right:0; height:2px; top:0;
    background:linear-gradient(90deg, transparent, var(--fg), transparent);
    box-shadow:0 0 14px 2px rgba(255,255,255,.6);
    animation:laserSweep 3.4s ease-in-out infinite;
  }
  .stage[data-anim="14"] .layer14{ opacity:.75; }
  @keyframes laserSweep{
    0%{ top:0; opacity:0; } 6%{ opacity:1; } 50%{ top:100%; opacity:1; } 56%{ opacity:0; } 100%{ top:100%; opacity:0; }
  }

  /* ============================================================ 15. EMBLEM PULSE ============================================================ */
  .layer15{ display:flex; align-items:center; justify-content:center; }
  .layer15 .emblem-spin{ animation:emblemSpin 44s linear infinite; }
  .layer15 .emblem{
    width:38vmin; height:38vmin;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    border:1px solid var(--fg);
    animation:emblemPulse 3.8s ease-in-out infinite;
  }
  .stage[data-anim="15"] .layer15{ opacity:1; }
  @keyframes emblemSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes emblemPulse{ 0%,100%{ opacity:.12; transform:scale(.94); } 50%{ opacity:.4; transform:scale(1); } }

  /* ============================================================ 17. SHARD DRIFT ============================================================ */
  .layer17 .shard{
    position:absolute; bottom:-40px;
    background:rgba(255,255,255,.55);
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation-name:shardDrift; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  .stage[data-anim="17"] .layer17{ opacity:1; }
  @keyframes shardDrift{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:.6; } 90%{ opacity:.6; }
    100%{ transform:translateY(-112vh) rotate(180deg); opacity:0; }
  }

  /* ============================================================ 18. CIPHER SCROLL ============================================================ */
  .layer18{ font-family:var(--font-mono); font-size:11px; color:var(--fg); }
  .layer18 .band{ position:absolute; left:0; white-space:nowrap; animation-name:cipherScroll; animation-timing-function:linear; animation-iteration-count:infinite; }
  .stage[data-anim="18"] .layer18{ opacity:.28; }
  @keyframes cipherScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
</style>
</head>
<body>
  <div class="tag">LAUNCHER // WALLPAPER_FX<b class="name" id="nameTag">01 · NEURO LINKS</b></div>

  <div class="stage" id="stage" data-anim="1">
    <canvas id="bgCanvas"></canvas>

    <div class="layer layer2"></div>
    <div class="layer layer3"></div>
    <div class="layer layer4"><div class="sweep"></div></div>
    <div class="layer layer6"></div>
    <div class="layer layer8">
      <div class="center"></div>
      <div class="orbit o1"><div class="dot"></div></div>
      <div class="orbit o2"><div class="dot"></div></div>
      <div class="orbit o3"><div class="dot"></div></div>
    </div>
    <div class="layer layer10"><div class="track" id="waveTrack"></div></div>
    <div class="layer layer11"><div class="warpwrap"></div></div>
    <div class="layer layer12" id="serverGrid"></div>
    <div class="layer layer14"></div>
    <div class="layer layer15"><div class="emblem-spin"><div class="emblem"></div></div></div>
    <div class="layer layer17" id="shardLayer"></div>
    <div class="layer layer18" id="cipherLayer"></div>
  </div>

  <div class="hexOverlay" id="hexOverlay"></div>

  <div class="panel">
    <h1>20 wallpaper concepts — tap to preview behind the grid</h1>
    <div class="anims" id="anims"></div>
  </div>

<script>
  const CONCEPTS = [
    { id:1,  name:'NEURO LINKS',       desc:'Drifting nodes, pulsing link lines' },
    { id:2,  name:'SCAN GRID',         desc:'3D floor grid scrolling toward you' },
    { id:3,  name:'DATA RAIN',         desc:'Falling monochrome glyph columns' },
    { id:4,  name:'PULSE RADAR',       desc:'Radar sweep + expanding rings' },
    { id:5,  name:'CIRCUIT TRACE',     desc:'PCB traces with traveling current' },
    { id:6,  name:'HEX LATTICE',       desc:'Faint honeycomb drifting diagonally' },
    { id:7,  name:'SIGNAL NOISE',      desc:'Subtle animated static grain' },
    { id:8,  name:'ORBIT NODES',       desc:'Satellites circling a center point' },
    { id:9,  name:'WIREFRAME TERRAIN', desc:'Undulating mesh horizon' },
    { id:10, name:'WAVEFORM SCROLL',   desc:'Scrolling equalizer bars' },
    { id:11, name:'WARP TUNNEL',       desc:'Radiating lines, hyperspace zoom' },
    { id:12, name:'SERVER GRID',       desc:'Server-rack status lights flicker' },
    { id:13, name:'WIRE SPHERE',       desc:'Rotating wireframe globe' },
    { id:14, name:'LASER SWEEP',       desc:'Single scanning line, top to bottom' },
    { id:15, name:'EMBLEM PULSE',      desc:'Breathing rotating hex emblem' },
    { id:16, name:'THREAT PING MAP',   desc:'Monitor grid with random pings' },
    { id:17, name:'SHARD DRIFT',       desc:'Hex shards floating upward' },
    { id:18, name:'CIPHER SCROLL',     desc:'Scrolling hex/binary text bands' },
    { id:19, name:'VOLTAGE ARC',       desc:'Occasional electric arc flicker' },
    { id:20, name:'STARFIELD DRIFT',   desc:'Parallax deep-space dust' },
  ];

  const stage = document.getElementById('stage');
  const nameTag = document.getElementById('nameTag');
  const animsEl = document.getElementById('anims');

  CONCEPTS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'anim-btn';
    btn.dataset.id = c.id;
    btn.innerHTML = '<b>' + String(c.id).padStart(2,'0') + ' ' + c.name + '</b>' + c.desc;
    btn.addEventListener('click', () => setConcept(c.id));
    animsEl.appendChild(btn);
  });

  let currentId = 1;

  function setConcept(id){
    currentId = id;
    stage.setAttribute('data-anim', id);
    document.querySelectorAll('.anim-btn').forEach(b => b.classList.toggle('active', +b.dataset.id === id));
    const c = CONCEPTS.find(c => c.id === id);
    nameTag.textContent = String(id).padStart(2,'0') + ' · ' + c.name;
    const fx = canvasFX[id];
    if (fx && fx.init) fx.init(window.innerWidth, window.innerHeight);
  }

  // hex grid overlay — sample cluster showing tiles sitting on top of the animation
  const hexOverlay = document.getElementById('hexOverlay');
  for (let i = 0; i < 24; i++) {
    const h = document.createElement('div');
    h.className = 'hex';
    hexOverlay.appendChild(h);
  }

  // waveform bars (concept 10)
  const waveTrack = document.getElementById('waveTrack');
  for (let i = 0; i < 80; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const height = 6 + Math.random() * 34;
    bar.style.height = height + 'px';
    bar.style.animationDuration = (0.7 + Math.random() * 0.9) + 's';
    bar.style.animationDelay = (Math.random() * -2) + 's';
    waveTrack.appendChild(bar);
  }

  // server status grid (concept 12)
  const serverGrid = document.getElementById('serverGrid');
  for (let i = 0; i < 160; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (Math.random() < 0.16) {
      cell.classList.add('on');
      cell.style.animationDelay = (Math.random() * -2.6) + 's';
      cell.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    }
    serverGrid.appendChild(cell);
  }

  // shard drift (concept 17)
  const shardLayer = document.getElementById('shardLayer');
  for (let i = 0; i < 16; i++) {
    const shard = document.createElement('div');
    shard.className = 'shard';
    const size = 8 + Math.random() * 14;
    shard.style.width = size + 'px';
    shard.style.height = size + 'px';
    shard.style.left = (Math.random() * 100) + '%';
    shard.style.animationDuration = (9 + Math.random() * 10) + 's';
    shard.style.animationDelay = (Math.random() * -18) + 's';
    shardLayer.appendChild(shard);
  }

  // cipher scroll (concept 18)
  const cipherLayer = document.getElementById('cipherLayer');
  const HEXCHARS = '0123456789ABCDEF';
  function randomHexLine(len){
    let s = '';
    for (let i = 0; i < len; i++) {
      s += HEXCHARS[Math.floor(Math.random() * 16)];
      if (i % 4 === 3) s += ' ';
    }
    return s;
  }
  for (let row = 0; row < 12; row++) {
    const band = document.createElement('div');
    band.className = 'band';
    const line = randomHexLine(220);
    band.textContent = line + '   ' + line;
    band.style.top = (row * 8.5) + '%';
    band.style.animationDuration = (18 + Math.random() * 22) + 's';
    band.style.animationDirection = row % 2 === 0 ? 'normal' : 'reverse';
    cipherLayer.appendChild(band);
  }

  // ============================================================ CANVAS CONCEPTS ============================================================
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');

  const canvasFX = {
    // 1. NEURO LINKS
    1: {
      nodes: [],
      init(w, h){
        this.nodes = Array.from({ length: 30 }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.18, vy: (Math.random() - 0.5) * 0.18
        }));
      },
      frame(ctx, w, h){
        if (!this.nodes.length) this.init(w, h);
        const nodes = this.nodes;
        nodes.forEach(n => {
          n.x += n.vx; n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
        });
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            const dist = Math.hypot(a.x - b.x, a.y - b.y);
            if (dist < 160) {
              ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - dist / 160) * 0.22) + ')';
              ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
        }
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        nodes.forEach(n => { ctx.beginPath(); ctx.arc(n.x, n.y, 1.6, 0, 7); ctx.fill(); });
      }
    },
    // 5. CIRCUIT TRACE
    5: {
      paths: [],
      init(w, h){
        this.paths = [];
        const cols = 8, rows = 6;
        const cellW = w / cols, cellH = h / rows;
        for (let i = 0; i < 11; i++) {
          let x = Math.floor(Math.random() * cols) * cellW;
          let y = Math.floor(Math.random() * rows) * cellH;
          const pts = [{ x, y }];
          const steps = 4 + Math.floor(Math.random() * 4);
          for (let s = 0; s < steps; s++) {
            if (Math.random() < 0.5) x += (Math.random() < 0.5 ? 1 : -1) * cellW;
            else y += (Math.random() < 0.5 ? 1 : -1) * cellH;
            x = Math.max(0, Math.min(w, x)); y = Math.max(0, Math.min(h, y));
            pts.push({ x, y });
          }
          this.paths.push({ pts, offset: Math.random() * 4000, speed: 0.4 + Math.random() * 0.4 });
        }
      },
      frame(ctx, w, h, t){
        if (!this.paths.length) this.init(w, h);
        this.paths.forEach(p => {
          ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1;
          ctx.beginPath();
          p.pts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
          ctx.stroke();
          let total = 0; const segs = [];
          for (let i = 1; i < p.pts.length; i++) {
            const a = p.pts[i - 1], b = p.pts[i];
            const len = Math.hypot(b.x - a.x, b.y - a.y);
            segs.push({ a, b, len, start: total }); total += len;
          }
          if (total === 0) return;
          const pos = (t * p.speed * 0.03 + p.offset) % total;
          const seg = segs.find(s => pos >= s.start && pos <= s.start + s.len) || segs[segs.length - 1];
          const lt = seg.len ? (pos - seg.start) / seg.len : 0;
          const px = seg.a.x + (seg.b.x - seg.a.x) * lt;
          const py = seg.a.y + (seg.b.y - seg.a.y) * lt;
          ctx.shadowColor = 'rgba(255,255,255,.7)'; ctx.shadowBlur = 7;
          ctx.fillStyle = 'rgba(255,255,255,.95)';
          ctx.beginPath(); ctx.arc(px, py, 2.2, 0, 7); ctx.fill();
          ctx.shadowBlur = 0;
        });
      }
    },
    // 7. SIGNAL NOISE
    7: {
      frame(ctx, w, h){
        for (let i = 0; i < 150; i++) {
          ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.09) + ')';
          ctx.fillRect(Math.random() * w, Math.random() * h, 3, 3);
        }
      }
    },
    // 9. WIREFRAME TERRAIN
    9: {
      frame(ctx, w, h, t){
        const rows = 13, cols = 26, horizon = h * 0.4;
        ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
        const pt = (c, r) => {
          const nx = c / cols, depth = r / rows;
          const persp = 1 / (1 - depth * 0.85 + 0.15);
          const x = w * 0.5 + (nx - 0.5) * w * persp;
          const wave = Math.sin(nx * 8 + t * 0.0006 + r * 0.4) * 8 * depth;
          const y = horizon + depth * (h - horizon) + wave;
          return { x, y };
        };
        for (let r = 0; r < rows; r++) {
          ctx.beginPath();
          for (let c = 0; c <= cols; c++) { const p = pt(c, r); c === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); }
          ctx.stroke();
        }
        for (let c = 0; c <= cols; c += 2) {
          ctx.beginPath();
          for (let r = 0; r < rows; r++) { const p = pt(c, r); r === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); }
          ctx.stroke();
        }
      }
    },
    // 13. WIRE SPHERE
    13: {
      frame(ctx, w, h, t){
        const cx = w / 2, cy = h * 0.4, R = Math.min(w, h) * 0.22;
        const rot = t * 0.00025;
        ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
        for (let lat = -60; lat <= 60; lat += 30) {
          const latRad = lat * Math.PI / 180;
          const r = Math.cos(latRad) * R, yOff = Math.sin(latRad) * R;
          ctx.beginPath();
          for (let a = 0; a <= 360; a += 6) {
            const rad = a * Math.PI / 180;
            const x = Math.cos(rad) * r * Math.cos(rot) - Math.sin(rad) * r * 0.15 * Math.sin(rot);
            a === 0 ? ctx.moveTo(cx + x, cy + yOff) : ctx.lineTo(cx + x, cy + yOff);
          }
          ctx.stroke();
        }
        for (let lon = 0; lon < 180; lon += 30) {
          const phase = lon * Math.PI / 180 + rot;
          ctx.beginPath();
          for (let a = 0; a <= 360; a += 6) {
            const rad = a * Math.PI / 180;
            const x = Math.sin(rad) * Math.cos(phase) * R;
            const y = Math.cos(rad) * R;
            a === 0 ? ctx.moveTo(cx + x, cy + y) : ctx.lineTo(cx + x, cy + y);
          }
          ctx.stroke();
        }
      }
    },
    // 16. THREAT PING MAP
    16: {
      points: [], pings: [], nextPing: 0,
      init(w, h){
        this.points = [];
        const cols = 11, rows = 7;
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          this.points.push({ x: (c + 0.5) / cols * w, y: (r + 0.5) / rows * h });
        }
        this.pings = []; this.nextPing = 0;
      },
      frame(ctx, w, h, t){
        if (!this.points.length) this.init(w, h);
        ctx.fillStyle = 'rgba(255,255,255,.28)';
        this.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, 7); ctx.fill(); });
        if (t > this.nextPing) {
          const p = this.points[Math.floor(Math.random() * this.points.length)];
          this.pings.push({ x: p.x, y: p.y, start: t });
          this.nextPing = t + 500 + Math.random() * 700;
        }
        this.pings = this.pings.filter(pg => t - pg.start < 1200);
        this.pings.forEach(pg => {
          const prog = (t - pg.start) / 1200;
          ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - prog) * 0.55) + ')'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(pg.x, pg.y, prog * 70, 0, 7); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,' + ((1 - prog) * 0.85) + ')';
          ctx.beginPath(); ctx.arc(pg.x, pg.y, 2, 0, 7); ctx.fill();
        });
      }
    },
    // 19. VOLTAGE ARC
    19: {
      arcs: [], nextArc: 0,
      frame(ctx, w, h, t){
        if (t > this.nextArc) {
          const x1 = Math.random() * w, y1 = h * 0.1 + Math.random() * h * 0.6;
          const x2 = x1 + (Math.random() - 0.5) * w * 0.4, y2 = y1 + (Math.random() - 0.5) * h * 0.3;
          const segs = 6 + Math.floor(Math.random() * 4);
          const pts = [{ x: x1, y: y1 }];
          for (let i = 1; i < segs; i++) {
            pts.push({
              x: x1 + (x2 - x1) * (i / segs) + (Math.random() - 0.5) * 24,
              y: y1 + (y2 - y1) * (i / segs) + (Math.random() - 0.5) * 24
            });
          }
          pts.push({ x: x2, y: y2 });
          this.arcs.push({ pts, start: t });
          this.nextArc = t + 900 + Math.random() * 1600;
        }
        this.arcs = this.arcs.filter(a => t - a.start < 220);
        this.arcs.forEach(a => {
          const prog = (t - a.start) / 220;
          ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - prog) * 0.9) + ')'; ctx.lineWidth = 1.4;
          ctx.shadowColor = 'rgba(255,255,255,.8)'; ctx.shadowBlur = 8;
          ctx.beginPath();
          a.pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
          ctx.stroke();
          ctx.shadowBlur = 0;
        });
      }
    },
    // 20. STARFIELD DRIFT
    20: {
      layers: [],
      init(w, h){
        this.layers = [0.15, 0.3, 0.5].map(speed => ({
          speed,
          stars: Array.from({ length: 46 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: 0.6 + Math.random() * 1.2 }))
        }));
      },
      frame(ctx, w, h, t){
        if (!this.layers.length) this.init(w, h);
        this.layers.forEach(layer => {
          ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + layer.speed * 0.6) + ')';
          layer.stars.forEach(s => {
            const y = (s.y + t * 0.012 * layer.speed) % h;
            ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 7); ctx.fill();
          });
        });
      }
    },
  };

  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Object.values(canvasFX).forEach(fx => fx.init && fx.init(window.innerWidth, window.innerHeight));
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function loop(t){
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const fx = canvasFX[currentId];
    if (fx && fx.frame) fx.frame(ctx, window.innerWidth, window.innerHeight, t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  setConcept(1);
</script>
