<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUNCHER — Hex Grid Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-head:'Chakra Petch','Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    /* STYLE 07 — INK / WHITE (pure monochrome, no accent) */
    --bg:#000000; --bg2:#0d0d0d; --fg:#ffffff; --dim:#666666; --accent:#ffffff; --accent2:#999999; --border:#2a2a2a;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--font-head); overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  .texture{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  /* app status readout — terminal style (variant 08), no box/border */
  .hud{
    position:fixed; top:20px; left:20px; z-index:5;
    display:flex; align-items:center; gap:9px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; color:var(--fg); pointer-events:none;
  }
  .hud .prompt{ color:var(--dim); }
  .hud .st{ color:var(--fg); font-weight:500; }
  .hud .sep{ color:var(--dim2); }
  .hud .lbl{ color:var(--dim); margin-right:4px; }
  .hud .cursor{ width:7px; height:12px; background:var(--fg); animation:blink 1s step-end infinite; flex:none; }
  .hud .signal{ display:flex; align-items:flex-end; gap:2px; height:10px; flex:none; }
  .hud .signal i{ width:2.5px; background:var(--dim2); display:block; }
  .hud .signal i:nth-child(1){ height:35%; } .hud .signal i:nth-child(2){ height:58%; }
  .hud .signal i:nth-child(3){ height:80%; } .hud .signal i:nth-child(4){ height:100%; }
  .hud .signal.active i{ background:var(--fg); }
  .hud .battery{ width:19px; height:10px; border:1px solid var(--dim); position:relative; flex:none; }
  .hud .battery::after{ content:''; position:absolute; right:-3px; top:2.5px; width:2px; height:4px; background:var(--dim); }
  .hud .battery i{ display:block; height:100%; background:var(--fg); width:82%; }
  .hud.hidden{ display:none; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0;} }

  .tag{
    position:fixed; top:18px; right:20px; z-index:5;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; color:var(--dim); text-align:right;
  }
  .tag b{ color:var(--fg); }

  .settings{
    position:fixed; bottom:20px; left:20px; z-index:20; width:230px; padding:12px 14px;
    background:rgba(13,13,13,.85); backdrop-filter:blur(6px); border:1px solid var(--border);
    font-family:var(--font-mono); font-size:10px; color:var(--dim);
  }
  .set-row{ margin-bottom:10px; }
  .set-row:last-child{ margin-bottom:0; }
  .set-row label{ display:flex; justify-content:space-between; letter-spacing:.09em; text-transform:uppercase; margin-bottom:5px; }
  .set-row label span{ color:var(--fg); }
  .set-row input[type=range]{ width:100%; accent-color:var(--fg); }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-row label{ margin:0; }
  .toggle-row input[type=checkbox]{ width:15px; height:15px; accent-color:var(--fg); cursor:pointer; }

  .actions{
    position:fixed; bottom:20px; right:20px; z-index:20; display:flex; gap:8px;
  }
  .actions button{
    padding:9px 16px; background:rgba(13,13,13,.85); backdrop-filter:blur(6px); border:1px solid var(--border); color:var(--fg);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  .actions button:hover{ border-color:var(--accent); }

  .hint{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase;
    transition:opacity .3s ease; pointer-events:none;
  }
  .hint::after{ content:'_'; color:var(--accent); animation:pulse 1s step-end infinite; margin-left:4px; }
  .stage.is-open .hint{ opacity:0; }

  .stage{ position:fixed; inset:0; z-index:2; cursor:pointer; }
  .stage.is-open{ cursor:default; }
  .hexfield{ position:absolute; inset:0; }

  .hex{ position:absolute; transition:left .25s ease, top .25s ease, width .25s ease, height .25s ease; }
  /* .hex-face = the ring (colored outline). .hex-inner = the dark face, inset so only a clean
     stroke of ring color shows. Avoids the antialiasing seam that `border` + `clip-path` causes. */
  .hex-face{
    position:relative; width:100%; height:100%;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--border);
    transform:scale(.9); transform-origin:center; cursor:pointer;
    opacity:0; user-select:none; -webkit-touch-callout:none; touch-action:none;
    transition:filter .18s ease;
  }
  .stage:not(.is-open) .hex-face{ animation:none !important; opacity:0; }
  .stage.is-open .hex-face{ opacity:1; }

  .hex-inner{
    position:absolute; inset:2px;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--bg2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  }

  .hex-face .idx{ font-family:var(--font-mono); font-size:8.5px; color:var(--dim); letter-spacing:.08em; }
  .hex-face .name{ font-family:var(--font-head); font-size:10.5px; font-weight:600; letter-spacing:.03em; color:var(--fg); text-transform:uppercase; text-align:center; line-height:1.1; padding:0 14px; }

  .hex-face[data-colored="1"]{
    background:var(--tile-accent);
    box-shadow:0 0 16px -3px var(--tile-accent);
  }
  .hex-face[data-colored="1"] .hex-inner{ background:color-mix(in srgb, var(--tile-accent) 20%, var(--bg2)); }

  /* press/hover highlight wins over a tile's own accent color — clear selection feedback */
  .hex-face:hover, .hex-face.drag-hover{ background:var(--accent); }
  .hex-face:hover .hex-inner, .hex-face.drag-hover .hex-inner{ background:#161616; }

  /* ===== ANIMATION 16 — Shatter Converge (outside-in) ===== */
  @keyframes shatter{
    from{ opacity:0; transform:scale(.9) translate(var(--fx,0px),var(--fy,0px)) rotate(var(--fr,0deg)); }
    to{ opacity:1; transform:scale(.9) translate(0,0) rotate(0); }
  }
  .stage.is-open .hex-face{ animation:shatter .6s cubic-bezier(.16,1,.3,1) both; }

  /* ===== long-press color picker ===== */
  .color-popover{
    position:fixed; z-index:50; width:216px; padding:12px;
    background:rgba(13,13,13,.96); backdrop-filter:blur(8px); border:1px solid var(--border);
    display:none; box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .color-popover.show{ display:block; }
  .color-popover .cp-label{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase; margin-bottom:8px; }
  .color-popover .cp-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .color-popover .cp-swatch{ width:100%; aspect-ratio:1; border:1px solid rgba(255,255,255,.15); cursor:pointer; }
  .color-popover .cp-swatch:hover{ outline:1px solid #fff; outline-offset:1px; }
  .color-popover .cp-reset{
    margin-top:8px; width:100%; padding:6px 0; background:transparent; border:1px solid var(--border); color:var(--dim);
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
  }
  .color-popover .cp-reset:hover{ border-color:var(--fg); color:var(--fg); }

  .toast{
    position:fixed; left:50%; bottom:88px; z-index:30;
    padding:10px 18px; background:rgba(13,13,13,.92); backdrop-filter:blur(6px); border:1px solid var(--border);
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--fg); text-transform:uppercase;
    opacity:0; pointer-events:none; transform:translate(-50%,10px); transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="texture"></div>

<div class="hud" id="hud">
  <span class="prompt">&gt;</span>
  <b class="st" id="hud-status">STANDBY</b>
  <span class="sep">·</span>
  <span id="hud-clock">00:00:00</span>
  <span class="sep">·</span>
  <span class="battery"><i></i></span>
  <span class="sep">·</span>
  <span class="signal active"><i></i><i></i><i></i><i></i></span>
  <span class="sep">·</span>
  <span><b id="hud-apps">30</b>&nbsp;<span class="lbl">APPS</span></span>
  <span class="cursor"></span>
</div>
<div class="tag">STYLE <b>07 — INK/WHITE</b><br>ANIM <b>16 — SHATTER CONVERGE</b></div>

<div class="stage" id="stage">
  <div class="hint">// click anywhere to initialize //</div>
  <div class="hexfield" id="hexfield"></div>
</div>

<div class="settings">
  <div class="set-row">
    <label>Größe <span id="size-val">118</span>px</label>
    <input type="range" id="size-range" min="60" max="170" value="118" step="2">
  </div>
  <div class="set-row">
    <label>Anzahl <span id="count-val">30</span></label>
    <input type="range" id="count-range" min="1" max="91" value="30" step="1">
  </div>
  <div class="set-row toggle-row">
    <label>HUD-Statusleiste</label>
    <input type="checkbox" id="hud-toggle" checked>
  </div>
  <div class="set-row toggle-row">
    <label>Vollbildmodus</label>
    <input type="checkbox" id="fullscreen-toggle">
  </div>
</div>

<div class="actions">
  <button id="btn-replay">Replay</button>
  <button id="btn-toggle">Öffnen</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var APPS = ['TERMINAL','VAULT','COMMS','NETSCAN','ARCHIVE','MEDIA','CIPHER','GRIDMAP','LEDGER','RELAY',
    'SENTRY','FORGE','CACHE','BEACON','PROXY','MODULE','ORACLE','NEXUS','DRIFT','ECHO',
    'PULSE','VECTOR','ANCHOR','NULLSPC','KERNEL','SHARD','WARDEN','CIRCUIT','HOLLOW','PRISM'];

  var COLORS = [
    '#00e5ff','#ffb020','#ff2d3c','#3d7dff','#aef000','#ff2fb0','#ffffff','#dfe6ee','#d4af37','#1fd3c4',
    '#ff6b35','#a855f7','#84cc16','#f43f5e','#6366f1','#facc15','#fb7185','#c026d3','#34d399','#64748b'
  ];

  var stage = document.getElementById('stage');
  var hexfield = document.getElementById('hexfield');
  var hudStatus = document.getElementById('hud-status');
  var hudClock = document.getElementById('hud-clock');
  var hudApps = document.getElementById('hud-apps');
  var sizeRange = document.getElementById('size-range');
  var sizeVal = document.getElementById('size-val');
  var countRange = document.getElementById('count-range');
  var countVal = document.getElementById('count-val');

  // optional URL params for embedding this demo at a fixed device size: ?size=64&count=19&auto=1
  var qs = new URLSearchParams(location.search);
  if(qs.has('size')) sizeRange.value = Math.min(Math.max(Number(qs.get('size')), Number(sizeRange.min)), Number(sizeRange.max));
  if(qs.has('count')) countRange.value = Math.min(Math.max(Number(qs.get('count')), Number(countRange.min)), Number(countRange.max));
  document.getElementById('size-val').textContent = sizeRange.value;
  document.getElementById('count-val').textContent = countRange.value;

  var isOpen = false;
  var hexEls = [];
  var colorMap = {};
  var hexSize = Number(sizeRange.value);
  var hexCount = Number(countRange.value);

  var LONG_PRESS_MS = 500;

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 900);
  }

  // ---- press / drag-highlight / release-to-launch (mouse + touch) ----
  var pressActive = false;
  var activeFace = null, activeIdx = null;
  var longPressTimer = null, longPressFired = false;
  var lastPX = 0, lastPY = 0;
  var suppressNextClick = false;

  function clearLongPressTimer(){ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; } }

  function setActiveFace(face){
    if(face === activeFace) return;
    if(activeFace) activeFace.classList.remove('drag-hover');
    activeFace = face;
    activeIdx = face ? Number(face.dataset.idx) : null;
    if(activeFace) activeFace.classList.add('drag-hover');
    clearLongPressTimer();
    longPressFired = false;
    if(activeFace){
      longPressTimer = setTimeout(function(){
        longPressFired = true;
        openColorPopover(activeIdx, lastPX, lastPY);
      }, LONG_PRESS_MS);
    }
  }

  function updateActiveFromPoint(x, y){
    lastPX = x; lastPY = y;
    var el = document.elementFromPoint(x, y);
    setActiveFace(el ? el.closest('.hex-face') : null);
  }

  function launchActive(){
    if(activeIdx === null) return;
    var el = hexEls[activeIdx];
    if(!el) return;
    var face = el.firstChild;
    face.style.filter = 'brightness(2.4)';
    setTimeout(function(){ face.style.filter = ''; }, 160);
    showToast('Starte ' + APPS[activeIdx % APPS.length]);
  }

  function endPress(){
    clearLongPressTimer();
    if(pressActive){
      if(longPressFired) suppressNextClick = true;
      else launchActive();
    }
    pressActive = false;
    if(activeFace) activeFace.classList.remove('drag-hover');
    activeFace = null; activeIdx = null;
  }

  hexfield.addEventListener('pointerdown', function(e){
    if(!isOpen) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    pressActive = true;
    updateActiveFromPoint(e.clientX, e.clientY);
  });
  document.addEventListener('pointermove', function(e){
    if(!pressActive || longPressFired) return;
    updateActiveFromPoint(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', function(){
    if(!pressActive) return;
    endPress();
  });
  document.addEventListener('pointercancel', function(){
    if(!pressActive) return;
    clearLongPressTimer();
    pressActive = false;
    if(activeFace) activeFace.classList.remove('drag-hover');
    activeFace = null; activeIdx = null;
  });

  // ---- color popover (built once) ----
  var popover = document.createElement('div');
  popover.className = 'color-popover';
  popover.innerHTML = '<div class="cp-label">Kachelfarbe wählen</div><div class="cp-grid" id="cp-grid"></div><button class="cp-reset" id="cp-reset">Zurücksetzen</button>';
  document.body.appendChild(popover);
  var cpGrid = popover.querySelector('#cp-grid');

  COLORS.forEach(function(c){
    var sw = document.createElement('div');
    sw.className = 'cp-swatch';
    sw.style.background = c;
    sw.addEventListener('click', function(e){
      e.stopPropagation();
      var idx = Number(popover.dataset.idx);
      colorMap[idx] = c;
      applyColor(idx);
      popover.classList.remove('show');
    });
    cpGrid.appendChild(sw);
  });
  popover.querySelector('#cp-reset').addEventListener('click', function(e){
    e.stopPropagation();
    var idx = Number(popover.dataset.idx);
    delete colorMap[idx];
    applyColor(idx);
    popover.classList.remove('show');
  });

  document.addEventListener('click', function(e){
    if(suppressNextClick){ suppressNextClick = false; return; }
    if(!popover.classList.contains('show')) return;
    if(!e.target.closest('.color-popover')) popover.classList.remove('show');
  });

  function applyColor(idx){
    var el = hexEls[idx];
    if(!el) return;
    var face = el.firstChild;
    var c = colorMap[idx];
    if(c){ face.dataset.colored = '1'; face.style.setProperty('--tile-accent', c); }
    else { face.dataset.colored = '0'; face.style.removeProperty('--tile-accent'); }
  }

  function openColorPopover(idx, clientX, clientY){
    popover.dataset.idx = idx;
    popover.style.left = clientX + 'px';
    popover.style.top = clientY + 'px';
    popover.classList.add('show');
    requestAnimationFrame(function(){
      var r = popover.getBoundingClientRect();
      var nx = clientX, ny = clientY;
      if(r.right > window.innerWidth - 8) nx -= (r.right - (window.innerWidth - 8));
      if(r.bottom > window.innerHeight - 8) ny -= (r.bottom - (window.innerHeight - 8));
      if(nx < 8) nx = 8;
      if(ny < 8) ny = 8;
      popover.style.left = nx + 'px';
      popover.style.top = ny + 'px';
    });
  }

  function makeHex(idx){
    var h = document.createElement('div');
    h.className = 'hex';
    var f = document.createElement('div');
    f.className = 'hex-face';
    f.dataset.idx = idx;
    f.innerHTML =
      '<div class="hex-inner">' +
        '<div class="idx">APP_' + String(idx+1).padStart(2,'0') + '</div>' +
        '<div class="name">' + APPS[idx % APPS.length] + '</div>' +
      '</div>';
    h.appendChild(f);
    hexfield.appendChild(h);

    f.addEventListener('contextmenu', function(e){ e.preventDefault(); });

    hexEls.push(h);
    if(colorMap[idx]) applyColor(idx);
  }

  function ensureCount(n){
    while(hexEls.length < n){ makeHex(hexEls.length); }
    while(hexEls.length > n){ hexfield.removeChild(hexEls.pop()); }
  }

  // Honeycomb fills the full available rectangle (uses width AND height) before shrinking.
  // At the requested tile size, figure out how many columns/rows actually fit on screen; only
  // once that capacity is smaller than the tile count does the tile size step down.
  var LAYOUT_MARGIN = 16;

  function hexCapacity(hexW, availW, availH){
    var s = hexW / Math.sqrt(3), hexH = s * 2;
    var cols = Math.max(1, Math.floor(availW / hexW));
    var rows = Math.max(1, Math.floor((availH - hexH * 0.25) / (hexH * 0.75)) + 1);
    return { cols: cols, rows: rows, hexH: hexH };
  }

  function layoutHexes(){
    var w = hexfield.clientWidth, h = hexfield.clientHeight;
    var n = hexEls.length;
    var availW = Math.max(40, w - LAYOUT_MARGIN * 2);
    var availH = Math.max(40, h - LAYOUT_MARGIN * 2);

    var hexW = hexSize;
    var cap = hexCapacity(hexW, availW, availH);
    while(cap.cols * cap.rows < n && hexW > 20){ hexW -= 1; cap = hexCapacity(hexW, availW, availH); }

    var cols = cap.cols, rows = cap.rows, hexH = cap.hexH;

    // every honeycomb cell that fits the rectangle, offset-staggered rows
    var cells = [];
    for(var row = 0; row < rows; row++){
      for(var col = 0; col < cols; col++){
        cells.push({ x: col * hexW + (row % 2 ? hexW / 2 : 0), y: row * hexH * 0.75 });
      }
    }
    var cx = cells.reduce(function(s,c){ return s + c.x; }, 0) / cells.length;
    var cy = cells.reduce(function(s,c){ return s + c.y; }, 0) / cells.length;
    cells.forEach(function(c){ c.dx = c.x - cx; c.dy = c.y - cy; c.dist = Math.hypot(c.dx, c.dy); });
    cells.sort(function(a,b){ return a.dist - b.dist; });
    var pts = cells.slice(0, n);

    var minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
    pts.forEach(function(p){
      minX = Math.min(minX, p.dx - hexW/2); maxX = Math.max(maxX, p.dx + hexW/2);
      minY = Math.min(minY, p.dy - hexH/2); maxY = Math.max(maxY, p.dy + hexH/2);
    });
    var offsetX = w/2 - (minX+maxX)/2;
    var offsetY = h/2 - (minY+maxY)/2;
    var maxDist = pts.reduce(function(m,p){ return Math.max(m, p.dist); }, 0);

    hexEls.forEach(function(el, i){
      var p = pts[i];
      el.style.width = hexW + 'px';
      el.style.height = hexH + 'px';
      el.style.left = (offsetX + p.dx - hexW/2) + 'px';
      el.style.top = (offsetY + p.dy - hexH/2) + 'px';

      var face = el.firstChild;
      face.style.setProperty('--fx', (p.dx*0.5) + 'px');
      face.style.setProperty('--fy', (p.dy*0.5) + 'px');
      face.style.setProperty('--fr', (Math.random()*40-20).toFixed(1) + 'deg');
      // outside-in: cells furthest from center fire first, center fires last
      face.style.animationDelay = (maxDist > 0 ? (maxDist - p.dist) / maxDist * 420 : 0).toFixed(0) + 'ms';
    });
  }

  function open(){
    if(isOpen) return;
    layoutHexes();
    stage.classList.remove('is-open');
    void stage.offsetWidth;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ stage.classList.add('is-open'); });
    });
    isOpen = true;
    hudStatus.textContent = 'ACTIVE';
    document.getElementById('btn-toggle').textContent = 'Schließen';
  }

  function close(){
    if(!isOpen) return;
    stage.classList.remove('is-open');
    isOpen = false;
    hudStatus.textContent = 'STANDBY';
    document.getElementById('btn-toggle').textContent = 'Öffnen';
  }

  function replay(){
    if(!isOpen) return;
    layoutHexes();
    stage.classList.remove('is-open');
    void stage.offsetWidth;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ stage.classList.add('is-open'); });
    });
  }

  stage.addEventListener('click', function(e){
    if(!isOpen){ open(); }
    else if(!e.target.closest('.hex')){ close(); }
  });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  window.addEventListener('resize', function(){ layoutHexes(); });

  document.getElementById('btn-replay').addEventListener('click', function(e){
    e.stopPropagation();
    if(!isOpen){ open(); } else { replay(); }
  });
  document.getElementById('btn-toggle').addEventListener('click', function(e){
    e.stopPropagation();
    if(isOpen) close(); else open();
  });

  sizeRange.addEventListener('input', function(e){ e.stopPropagation(); hexSize = Number(sizeRange.value); sizeVal.textContent = hexSize; layoutHexes(); });
  sizeRange.addEventListener('click', function(e){ e.stopPropagation(); });
  countRange.addEventListener('input', function(e){ e.stopPropagation(); hexCount = Number(countRange.value); countVal.textContent = hexCount; hudApps.textContent = hexCount; ensureCount(hexCount); layoutHexes(); });
  countRange.addEventListener('click', function(e){ e.stopPropagation(); });

  function tickClock(){
    var d = new Date();
    hudClock.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  }
  tickClock();
  setInterval(tickClock, 1000);
  hudApps.textContent = hexCount;

  // ---- HUD status bar on/off ----
  var hud = document.getElementById('hud');
  var hudToggle = document.getElementById('hud-toggle');
  hudToggle.addEventListener('change', function(e){
    e.stopPropagation();
    hud.classList.toggle('hidden', !hudToggle.checked);
  });
  hudToggle.addEventListener('click', function(e){ e.stopPropagation(); });

  // ---- fullscreen on/off (browser Fullscreen API stand-in for the native always-fullscreen mode) ----
  var fullscreenToggle = document.getElementById('fullscreen-toggle');
  fullscreenToggle.addEventListener('change', function(e){
    e.stopPropagation();
    if(fullscreenToggle.checked){
      if(document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen().catch(function(){ fullscreenToggle.checked = false; });
      }
    } else if(document.fullscreenElement){
      document.exitFullscreen();
    }
  });
  fullscreenToggle.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('fullscreenchange', function(){
    fullscreenToggle.checked = !!document.fullscreenElement;
  });

  ensureCount(hexCount);
  layoutHexes();

  if(qs.get('auto') === '1'){ setTimeout(open, 300); }
})();
</script>
</body>
</html>
