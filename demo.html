<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eVe Launcher — Hex Grid Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-head:'Chakra Petch','Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    /* STYLE 07 — INK / WHITE (pure monochrome, no accent) */
    --bg:#000000; --bg2:#0d0d0d; --fg:#ffffff; --dim:#666666; --accent:#ffffff; --accent2:#999999; --border:#2a2a2a;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--font-head); overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  .texture{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  .hud{
    position:fixed; top:18px; left:20px; z-index:5;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--dim); pointer-events:none;
  }
  .hud .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:8px; box-shadow:0 0 8px var(--accent); animation:pulse 1.8s ease-in-out infinite; }
  .hud b{ color:var(--fg); font-weight:500; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .tag{
    position:fixed; top:18px; right:20px; z-index:5;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; color:var(--dim); text-align:right;
  }
  .tag b{ color:var(--fg); }

  .settings{
    position:fixed; bottom:20px; left:20px; z-index:20; width:230px; padding:12px 14px;
    background:rgba(13,13,13,.85); backdrop-filter:blur(6px); border:1px solid var(--border);
    font-family:var(--font-mono); font-size:10px; color:var(--dim);
  }
  .set-row{ margin-bottom:10px; }
  .set-row:last-child{ margin-bottom:0; }
  .set-row label{ display:flex; justify-content:space-between; letter-spacing:.09em; text-transform:uppercase; margin-bottom:5px; }
  .set-row label span{ color:var(--fg); }
  .set-row input[type=range]{ width:100%; accent-color:var(--fg); }

  .actions{
    position:fixed; bottom:20px; right:20px; z-index:20; display:flex; gap:8px;
  }
  .actions button{
    padding:9px 16px; background:rgba(13,13,13,.85); backdrop-filter:blur(6px); border:1px solid var(--border); color:var(--fg);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  .actions button:hover{ border-color:var(--accent); }

  .hint{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase;
    transition:opacity .3s ease; pointer-events:none;
  }
  .hint::after{ content:'_'; color:var(--accent); animation:pulse 1s step-end infinite; margin-left:4px; }
  .stage.is-open .hint{ opacity:0; }

  .stage{ position:fixed; inset:0; z-index:2; cursor:pointer; }
  .stage.is-open{ cursor:default; }
  .hexfield{ position:absolute; inset:0; }

  .hex{ position:absolute; transition:left .25s ease, top .25s ease, width .25s ease, height .25s ease; }
  .hex-face{
    width:100%; height:100%;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--bg2); border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    transform:scale(.9); transform-origin:center; cursor:pointer;
    opacity:0; user-select:none; -webkit-touch-callout:none;
  }
  .stage:not(.is-open) .hex-face{ animation:none !important; opacity:0; }
  .stage.is-open .hex-face{ opacity:1; }

  .hex-face:hover{ border-color:var(--accent); background:#161616; }
  .hex-face .idx{ font-family:var(--font-mono); font-size:8.5px; color:var(--dim); letter-spacing:.08em; position:relative; z-index:1; }
  .hex-face .name{ font-family:var(--font-head); font-size:10.5px; font-weight:600; letter-spacing:.03em; color:var(--fg); text-transform:uppercase; text-align:center; line-height:1.1; padding:0 14px; position:relative; z-index:1; }

  .hex-face[data-colored="1"]{
    border-color:var(--tile-accent);
    background:color-mix(in srgb, var(--tile-accent) 20%, var(--bg2));
    box-shadow:0 0 16px -3px var(--tile-accent);
  }
  .hex-face.pressing{ filter:brightness(1.35); }

  /* ===== ANIMATION 16 — Shatter Converge (outside-in) ===== */
  @keyframes shatter{
    from{ opacity:0; transform:scale(.9) translate(var(--fx,0px),var(--fy,0px)) rotate(var(--fr,0deg)); }
    to{ opacity:1; transform:scale(.9) translate(0,0) rotate(0); }
  }
  .stage.is-open .hex-face{ animation:shatter .6s cubic-bezier(.16,1,.3,1) both; }

  /* ===== long-press color picker ===== */
  .color-popover{
    position:fixed; z-index:50; width:216px; padding:12px;
    background:rgba(13,13,13,.96); backdrop-filter:blur(8px); border:1px solid var(--border);
    display:none; box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .color-popover.show{ display:block; }
  .color-popover .cp-label{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase; margin-bottom:8px; }
  .color-popover .cp-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .color-popover .cp-swatch{ width:100%; aspect-ratio:1; border:1px solid rgba(255,255,255,.15); cursor:pointer; }
  .color-popover .cp-swatch:hover{ outline:1px solid #fff; outline-offset:1px; }
  .color-popover .cp-reset{
    margin-top:8px; width:100%; padding:6px 0; background:transparent; border:1px solid var(--border); color:var(--dim);
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
  }
  .color-popover .cp-reset:hover{ border-color:var(--fg); color:var(--fg); }
</style>
</head>
<body>

<div class="texture"></div>

<div class="hud"><span class="dot"></span>SYS://LAUNCHER&nbsp; STATUS: <b id="hud-status">STANDBY</b></div>
<div class="tag">STYLE <b>07 — INK/WHITE</b><br>ANIM <b>16 — SHATTER CONVERGE</b></div>

<div class="stage" id="stage">
  <div class="hint">// click anywhere to initialize //</div>
  <div class="hexfield" id="hexfield"></div>
</div>

<div class="settings">
  <div class="set-row">
    <label>Größe <span id="size-val">118</span>px</label>
    <input type="range" id="size-range" min="60" max="170" value="118" step="2">
  </div>
  <div class="set-row">
    <label>Anzahl <span id="count-val">30</span></label>
    <input type="range" id="count-range" min="1" max="91" value="30" step="1">
  </div>
</div>

<div class="actions">
  <button id="btn-replay">Replay</button>
  <button id="btn-toggle">Öffnen</button>
</div>

<script>
(function(){
  var APPS = ['TERMINAL','VAULT','COMMS','NETSCAN','ARCHIVE','MEDIA','CIPHER','GRIDMAP','LEDGER','RELAY',
    'SENTRY','FORGE','CACHE','BEACON','PROXY','MODULE','ORACLE','NEXUS','DRIFT','ECHO',
    'PULSE','VECTOR','ANCHOR','NULLSPC','KERNEL','SHARD','WARDEN','CIRCUIT','HOLLOW','PRISM'];

  var COLORS = [
    '#00e5ff','#ffb020','#ff2d3c','#3d7dff','#aef000','#ff2fb0','#ffffff','#dfe6ee','#d4af37','#1fd3c4',
    '#ff6b35','#a855f7','#84cc16','#f43f5e','#6366f1','#facc15','#fb7185','#c026d3','#34d399','#64748b'
  ];

  var HEX_DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];

  var stage = document.getElementById('stage');
  var hexfield = document.getElementById('hexfield');
  var hudStatus = document.getElementById('hud-status');
  var sizeRange = document.getElementById('size-range');
  var sizeVal = document.getElementById('size-val');
  var countRange = document.getElementById('count-range');
  var countVal = document.getElementById('count-val');

  var isOpen = false;
  var hexEls = [];
  var colorMap = {};
  var hexSize = Number(sizeRange.value);
  var hexCount = Number(countRange.value);

  var LONG_PRESS_MS = 500;
  var MOVE_TOLERANCE = 8;

  // ---- color popover (built once) ----
  var popover = document.createElement('div');
  popover.className = 'color-popover';
  popover.innerHTML = '<div class="cp-label">Kachelfarbe wählen</div><div class="cp-grid" id="cp-grid"></div><button class="cp-reset" id="cp-reset">Zurücksetzen</button>';
  document.body.appendChild(popover);
  var cpGrid = popover.querySelector('#cp-grid');
  var popoverJustOpened = false;

  COLORS.forEach(function(c){
    var sw = document.createElement('div');
    sw.className = 'cp-swatch';
    sw.style.background = c;
    sw.addEventListener('click', function(e){
      e.stopPropagation();
      var idx = Number(popover.dataset.idx);
      colorMap[idx] = c;
      applyColor(idx);
      popover.classList.remove('show');
    });
    cpGrid.appendChild(sw);
  });
  popover.querySelector('#cp-reset').addEventListener('click', function(e){
    e.stopPropagation();
    var idx = Number(popover.dataset.idx);
    delete colorMap[idx];
    applyColor(idx);
    popover.classList.remove('show');
  });

  document.addEventListener('click', function(e){
    if(!popover.classList.contains('show') || popoverJustOpened) return;
    if(!e.target.closest('.color-popover')) popover.classList.remove('show');
  });

  function applyColor(idx){
    var el = hexEls[idx];
    if(!el) return;
    var face = el.firstChild;
    var c = colorMap[idx];
    if(c){ face.dataset.colored = '1'; face.style.setProperty('--tile-accent', c); }
    else { face.dataset.colored = '0'; face.style.removeProperty('--tile-accent'); }
  }

  function openColorPopover(idx, clientX, clientY){
    popover.dataset.idx = idx;
    popover.style.left = clientX + 'px';
    popover.style.top = clientY + 'px';
    popover.classList.add('show');
    popoverJustOpened = true;
    setTimeout(function(){ popoverJustOpened = false; }, 60);
    requestAnimationFrame(function(){
      var r = popover.getBoundingClientRect();
      var nx = clientX, ny = clientY;
      if(r.right > window.innerWidth - 8) nx -= (r.right - (window.innerWidth - 8));
      if(r.bottom > window.innerHeight - 8) ny -= (r.bottom - (window.innerHeight - 8));
      if(nx < 8) nx = 8;
      if(ny < 8) ny = 8;
      popover.style.left = nx + 'px';
      popover.style.top = ny + 'px';
    });
  }

  // ---- hex spiral: index 0 = center, then ring 1, ring 2, ... (growth stays centered) ----
  function hexRing(radius){
    if(radius === 0) return [{q:0,r:0,ring:0}];
    var res = [];
    var q = HEX_DIRS[4][0]*radius, r = HEX_DIRS[4][1]*radius;
    for(var side=0; side<6; side++){
      for(var step=0; step<radius; step++){
        res.push({q:q, r:r, ring:radius});
        q += HEX_DIRS[side][0]; r += HEX_DIRS[side][1];
      }
    }
    return res;
  }
  function hexSpiral(n){
    var list = [{q:0,r:0,ring:0}];
    var ring = 1;
    while(list.length < n){ list = list.concat(hexRing(ring)); ring++; }
    return list.slice(0, n);
  }

  function makeHex(idx){
    var h = document.createElement('div');
    h.className = 'hex';
    var f = document.createElement('div');
    f.className = 'hex-face';
    f.innerHTML =
      '<div class="idx">APP_' + String(idx+1).padStart(2,'0') + '</div>' +
      '<div class="name">' + APPS[idx % APPS.length] + '</div>';
    h.appendChild(f);
    hexfield.appendChild(h);

    var pressTimer = null, startX = 0, startY = 0;
    function cancelPress(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } f.classList.remove('pressing'); }
    f.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      f.classList.add('pressing');
      pressTimer = setTimeout(function(){
        pressTimer = null;
        f.classList.remove('pressing');
        openColorPopover(idx, e.clientX, e.clientY);
      }, LONG_PRESS_MS);
    });
    f.addEventListener('pointermove', function(e){
      if(pressTimer && (Math.abs(e.clientX-startX) > MOVE_TOLERANCE || Math.abs(e.clientY-startY) > MOVE_TOLERANCE)) cancelPress();
    });
    f.addEventListener('pointerup', cancelPress);
    f.addEventListener('pointerleave', cancelPress);
    f.addEventListener('contextmenu', function(e){ e.preventDefault(); });

    hexEls.push(h);
    if(colorMap[idx]) applyColor(idx);
  }

  function ensureCount(n){
    while(hexEls.length < n){ makeHex(hexEls.length); }
    while(hexEls.length > n){ hexfield.removeChild(hexEls.pop()); }
  }

  // pointy-top axial hex grid, spiraling out from the center
  function layoutHexes(){
    var w = hexfield.clientWidth, h = hexfield.clientHeight;
    var coords = hexSpiral(hexEls.length);
    var hexW = hexSize;
    var s = hexW / Math.sqrt(3);
    var hexH = s * 2;

    var pts = coords.map(function(c){
      return { x: s*Math.sqrt(3)*(c.q + c.r/2), y: s*1.5*c.r, ring: c.ring };
    });

    var minX=0,maxX=0,minY=0,maxY=0;
    pts.forEach(function(p){
      minX = Math.min(minX, p.x - hexW/2); maxX = Math.max(maxX, p.x + hexW/2);
      minY = Math.min(minY, p.y - hexH/2); maxY = Math.max(maxY, p.y + hexH/2);
    });
    var offsetX = w/2 - (minX+maxX)/2;
    var offsetY = h/2 - (minY+maxY)/2;

    var maxRing = pts.reduce(function(m,p){ return Math.max(m,p.ring); }, 0);

    hexEls.forEach(function(el, i){
      var p = pts[i];
      el.style.width = hexW + 'px';
      el.style.height = hexH + 'px';
      el.style.left = (offsetX + p.x - hexW/2) + 'px';
      el.style.top = (offsetY + p.y - hexH/2) + 'px';

      var face = el.firstChild;
      face.style.setProperty('--fx', (p.x*0.5) + 'px');
      face.style.setProperty('--fy', (p.y*0.5) + 'px');
      face.style.setProperty('--fr', (Math.random()*40-20).toFixed(1) + 'deg');
      // outside-in: outer rings fire first, center fires last
      face.style.animationDelay = ((maxRing - p.ring) * 70) + 'ms';
    });
  }

  function open(){
    if(isOpen) return;
    layoutHexes();
    stage.classList.remove('is-open');
    void stage.offsetWidth;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ stage.classList.add('is-open'); });
    });
    isOpen = true;
    hudStatus.textContent = 'ACTIVE';
    document.getElementById('btn-toggle').textContent = 'Schließen';
  }

  function close(){
    if(!isOpen) return;
    stage.classList.remove('is-open');
    isOpen = false;
    hudStatus.textContent = 'STANDBY';
    document.getElementById('btn-toggle').textContent = 'Öffnen';
  }

  function replay(){
    if(!isOpen) return;
    layoutHexes();
    stage.classList.remove('is-open');
    void stage.offsetWidth;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ stage.classList.add('is-open'); });
    });
  }

  stage.addEventListener('click', function(e){
    if(!isOpen){ open(); }
    else if(!e.target.closest('.hex')){ close(); }
  });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  window.addEventListener('resize', function(){ layoutHexes(); });

  document.getElementById('btn-replay').addEventListener('click', function(e){
    e.stopPropagation();
    if(!isOpen){ open(); } else { replay(); }
  });
  document.getElementById('btn-toggle').addEventListener('click', function(e){
    e.stopPropagation();
    if(isOpen) close(); else open();
  });

  sizeRange.addEventListener('input', function(e){ e.stopPropagation(); hexSize = Number(sizeRange.value); sizeVal.textContent = hexSize; layoutHexes(); });
  sizeRange.addEventListener('click', function(e){ e.stopPropagation(); });
  countRange.addEventListener('input', function(e){ e.stopPropagation(); hexCount = Number(countRange.value); countVal.textContent = hexCount; ensureCount(hexCount); layoutHexes(); });
  countRange.addEventListener('click', function(e){ e.stopPropagation(); });

  ensureCount(hexCount);
  layoutHexes();
})();
</script>
</body>
</html>
