<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUNCHER — Tile Animation Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-head:'Chakra Petch','Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --bg:#000000; --bg2:#0d0d0d; --fg:#ffffff; --dim:#666666; --dim2:#3a3a3a; --accent:#ffffff; --border:#2a2a2a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-head);
    overflow:hidden; -webkit-font-smoothing:antialiased; perspective:1000px;
  }
  .texture{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,.6) 100%);
  }

  .tag{
    position:fixed; top:18px; left:20px; z-index:5;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; color:var(--dim);
  }
  .tag b{ color:var(--fg); }

  .stage{ position:fixed; inset:0; z-index:2; cursor:pointer; }
  .hint{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase;
    transition:opacity .3s ease; pointer-events:none;
  }
  .hint::after{ content:'_'; color:var(--accent); animation:pulse 1s step-end infinite; margin-left:4px; }
  .stage.is-open .hint{ opacity:0; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .hexfield{ position:absolute; inset:0; }
  .hex{ position:absolute; }
  .hex-face{
    position:relative; width:100%; height:100%;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--border); cursor:default; opacity:0;
  }
  .hex-inner{
    position:absolute; inset:2px;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--bg2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .hex-face .idx{ font-family:var(--font-mono); font-size:8px; color:var(--dim); letter-spacing:.6px; }
  .hex-face .name{ font-family:var(--font-head); font-size:9.5px; font-weight:600; color:var(--fg); text-transform:uppercase; }

  /* ===== panel ===== */
  .panel{
    position:fixed; bottom:16px; left:16px; right:16px; z-index:20;
    background:rgba(13,13,13,.92); backdrop-filter:blur(8px); border:1px solid var(--border);
    padding:12px 14px; font-family:var(--font-mono);
  }
  .panel h1{ margin:0 0 8px; font-size:10px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; font-weight:600; }
  .anims{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  @media (max-width:640px){ .anims{ grid-template-columns:repeat(2,1fr); } }
  .anim-btn{
    padding:8px 6px; background:transparent; border:1px solid var(--border); color:var(--dim);
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.03em; cursor:pointer; text-align:left; line-height:1.3;
  }
  .anim-btn b{ display:block; color:var(--dim); font-size:10.5px; margin-bottom:1px; }
  .anim-btn.active{ border-color:var(--accent); color:var(--fg); background:rgba(255,255,255,.06); }
  .anim-btn.active b{ color:var(--fg); }

  /* ============================================================
     ANIMATIONS — each defines .stage.is-open[data-anim="N"] .hex-face
     (open) and .stage.closing[data-anim="N"] .hex-face (close).
     ============================================================ */

  /* ---------- 1. SCANLINE WIPE ---------- */
  @keyframes a1-open{ from{opacity:0; clip-path:inset(100% 0 0 0); filter:brightness(2.2);} 60%{opacity:1; filter:brightness(1.6);} to{opacity:1; clip-path:inset(0 0 0 0); filter:brightness(1);} }
  @keyframes a1-close{ from{opacity:1; clip-path:inset(0 0 0 0);} to{opacity:0; clip-path:inset(0 0 100% 0);} }
  .stage.is-open[data-anim="1"] .hex-face{ animation-name:a1-open; animation-timing-function:steps(10,end); }
  .stage.closing[data-anim="1"] .hex-face{ animation-name:a1-close; animation-timing-function:steps(8,end); }

  /* ---------- 2. GLITCH SNAP ---------- */
  @keyframes a2-open{
    0%{opacity:0; transform:scale(.9) translateX(-8px); filter:brightness(3) saturate(0);}
    20%{opacity:1; transform:scale(.9) translateX(6px);}
    40%{opacity:.4; transform:scale(.9) translateX(-3px);}
    60%{opacity:1; transform:scale(.9) translateX(2px);}
    80%{opacity:.7; transform:scale(.9) translateX(-1px);}
    100%{opacity:1; transform:scale(.9) translateX(0); filter:brightness(1);}
  }
  @keyframes a2-close{
    0%{opacity:1; transform:scale(.9) translateX(0); filter:brightness(1);}
    30%{opacity:.5; transform:scale(.9) translateX(5px); filter:brightness(2);}
    60%{opacity:.8; transform:scale(.9) translateX(-4px);}
    100%{opacity:0; transform:scale(.9) translateX(10px); filter:brightness(3) saturate(0);}
  }
  .stage.is-open[data-anim="2"] .hex-face{ animation-name:a2-open; animation-timing-function:steps(7,end); }
  .stage.closing[data-anim="2"] .hex-face{ animation-name:a2-close; animation-timing-function:steps(5,end); }

  /* ---------- 3. HEX IRIS ---------- */
  @keyframes a3-open{ from{opacity:0; transform:scale(0);} to{opacity:1; transform:scale(.9);} }
  @keyframes a3-close{ from{opacity:1; transform:scale(.9);} to{opacity:0; transform:scale(0);} }
  .stage.is-open[data-anim="3"] .hex-face{ animation-name:a3-open; animation-timing-function:cubic-bezier(.34,1.56,.64,1); }
  .stage.closing[data-anim="3"] .hex-face{ animation-name:a3-close; animation-timing-function:cubic-bezier(.7,0,.84,0); }

  /* ---------- 4. CIRCUIT TRACE (ring first, content follows) ---------- */
  @keyframes a4-ring-open{ from{opacity:0; transform:scale(.6);} to{opacity:1; transform:scale(.9);} }
  @keyframes a4-ring-close{ from{opacity:1; transform:scale(.9);} 40%{opacity:1; transform:scale(.9);} to{opacity:0; transform:scale(.6);} }
  @keyframes a4-inner-open{ from{opacity:0;} to{opacity:1;} }
  @keyframes a4-inner-close{ from{opacity:1;} to{opacity:0;} }
  .stage.is-open[data-anim="4"] .hex-face{ animation-name:a4-ring-open; animation-timing-function:cubic-bezier(.16,1,.3,1); }
  .stage.closing[data-anim="4"] .hex-face{ animation-name:a4-ring-close; animation-timing-function:ease-in; }
  .stage.is-open[data-anim="4"] .hex-inner{ opacity:0; animation-name:a4-inner-open; animation-timing-function:linear; animation-delay:calc(var(--delay) + 180ms); }
  .stage.closing[data-anim="4"] .hex-inner{ animation-name:a4-inner-close; animation-timing-function:linear; animation-delay:var(--close-delay); animation-duration:120ms; }

  /* ---------- 5. VERTICAL SLIDE-SNAP ---------- */
  @keyframes a5-open{ from{opacity:0; transform:scale(.9) translateY(-46px);} to{opacity:1; transform:scale(.9) translateY(0);} }
  @keyframes a5-close{ from{opacity:1; transform:scale(.9) translateY(0);} to{opacity:0; transform:scale(.9) translateY(34px);} }
  .stage.is-open[data-anim="5"] .hex-face{ animation-name:a5-open; animation-timing-function:cubic-bezier(.2,.9,.3,1); }
  .stage.closing[data-anim="5"] .hex-face{ animation-name:a5-close; animation-timing-function:cubic-bezier(.7,0,.84,0); }

  /* ---------- 6. DEPTH FLIP (Z) ---------- */
  .stage[data-anim="6"] .hex{ transform-style:preserve-3d; }
  @keyframes a6-open{ from{opacity:0; transform:scale(.9) rotateX(-95deg);} to{opacity:1; transform:scale(.9) rotateX(0deg);} }
  @keyframes a6-close{ from{opacity:1; transform:scale(.9) rotateX(0deg);} to{opacity:0; transform:scale(.9) rotateX(95deg);} }
  .stage.is-open[data-anim="6"] .hex-face{ animation-name:a6-open; animation-timing-function:cubic-bezier(.16,1,.3,1); }
  .stage.closing[data-anim="6"] .hex-face{ animation-name:a6-close; animation-timing-function:ease-in; }

  /* ---------- 7. PIXEL DISSOLVE ---------- */
  @keyframes a7-open{ from{opacity:0; transform:scale(.35); filter:contrast(3) brightness(1.8);} to{opacity:1; transform:scale(.9); filter:contrast(1) brightness(1);} }
  @keyframes a7-close{ from{opacity:1; transform:scale(.9); filter:contrast(1) brightness(1);} to{opacity:0; transform:scale(.35); filter:contrast(3) brightness(1.8);} }
  .stage.is-open[data-anim="7"] .hex-face{ animation-name:a7-open; animation-timing-function:steps(5,end); }
  .stage.closing[data-anim="7"] .hex-face{ animation-name:a7-close; animation-timing-function:steps(4,end); }

  /* ---------- 8. RADIAL PULSE (power-on) ---------- */
  @keyframes a8-open{ 0%{opacity:0; transform:scale(0); filter:brightness(3);} 55%{opacity:1; transform:scale(1.08); filter:brightness(2);} 100%{opacity:1; transform:scale(.9); filter:brightness(1);} }
  @keyframes a8-close{ 0%{opacity:1; transform:scale(.9); filter:brightness(1);} 30%{opacity:1; transform:scale(1.05); filter:brightness(2.4);} 100%{opacity:0; transform:scale(0); filter:brightness(3);} }
  .stage.is-open[data-anim="8"] .hex-face{ animation-name:a8-open; animation-timing-function:cubic-bezier(.2,.8,.3,1); }
  .stage.closing[data-anim="8"] .hex-face{ animation-name:a8-close; animation-timing-function:cubic-bezier(.6,0,.9,0); }

  /* ---------- 9. CORNER UNFOLD ---------- */
  @keyframes a9-open{ from{opacity:0; transform:scale(0);} to{opacity:1; transform:scale(.9);} }
  @keyframes a9-close{ from{opacity:1; transform:scale(.9);} to{opacity:0; transform:scale(0);} }
  .stage.is-open[data-anim="9"] .hex-face{ animation-name:a9-open; animation-timing-function:cubic-bezier(.16,1,.3,1); transform-origin:var(--corner,center); }
  .stage.closing[data-anim="9"] .hex-face{ animation-name:a9-close; animation-timing-function:ease-in; transform-origin:var(--corner,center); }

  /* ---------- 10. TERMINAL TYPE-ON (ring draws, content types) ---------- */
  @keyframes a10-ring-open{ from{opacity:0; transform:scale(.9) scaleY(.05);} to{opacity:1; transform:scale(.9) scaleY(1);} }
  @keyframes a10-ring-close{ from{opacity:1; transform:scale(.9) scaleY(1);} to{opacity:0; transform:scale(.9) scaleY(.05);} }
  @keyframes a10-inner-open{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);} }
  @keyframes a10-inner-close{ from{opacity:1;} to{opacity:0;} }
  .stage.is-open[data-anim="10"] .hex-face{ animation-name:a10-ring-open; animation-timing-function:steps(6,end); }
  .stage.closing[data-anim="10"] .hex-face{ animation-name:a10-ring-close; animation-timing-function:ease-in; animation-delay:calc(var(--close-delay) + 90ms); }
  .stage.is-open[data-anim="10"] .hex-inner{ opacity:0; animation-name:a10-inner-open; animation-timing-function:linear; animation-delay:calc(var(--delay) + 140ms); animation-duration:160ms; }
  .stage.closing[data-anim="10"] .hex-inner{ animation-name:a10-inner-close; animation-timing-function:linear; animation-delay:var(--close-delay); animation-duration:90ms; }

  /* shared stagger + duration hookup for the simple (single hex-face keyframe) variants */
  .stage.is-open .hex-face{ animation-duration:var(--dur,560ms); animation-delay:var(--delay,0ms); animation-fill-mode:both; }
  .stage.closing .hex-face{ animation-duration:280ms; animation-delay:var(--close-delay,0ms); animation-fill-mode:both; }
  .stage:not(.is-open):not(.closing) .hex-face{ opacity:0; animation:none !important; }
  .stage.is-open .hex-inner{ animation-fill-mode:both; }
</style>
</head>
<body>

<div class="texture"></div>
<div class="tag">STYLE <b>07 — INK/WHITE</b><br>10 TILE-ANIMATIONEN — EIN/AUSBLENDEN</div>

<div class="stage" id="stage">
  <div class="hint">// tippen zum öffnen //</div>
  <div class="hexfield" id="hexfield"></div>
</div>

<div class="panel">
  <h1>Animation wählen (tippen zum Vorschau-Öffnen / erneut tippen für Neustart)</h1>
  <div class="anims" id="anims"></div>
</div>

<script>
(function(){
  var APPS = ['TERMINAL','VAULT','COMMS','NETSCAN','ARCHIVE','MEDIA','CIPHER','GRIDMAP','LEDGER','RELAY',
    'SENTRY','FORGE','CACHE','BEACON','PROXY','MODULE','ORACLE','NEXUS','DRIFT','ECHO','PULSE','VECTOR','ANCHOR','NULLSPC'];

  var ANIMS = [
    {n:1, name:'Scanline Wipe', desc:'Scan-Balken deckt auf/zu'},
    {n:2, name:'Glitch Snap', desc:'Digitales Flackern, dann fest'},
    {n:3, name:'Hex Iris', desc:'Blende aus dem Zentrum'},
    {n:4, name:'Circuit Trace', desc:'Rahmen zuerst, Inhalt folgt'},
    {n:5, name:'Slide-Snap', desc:'Fällt von oben, harter Stopp'},
    {n:6, name:'Depth Flip', desc:'3D-Kippen um X-Achse'},
    {n:7, name:'Pixel Dissolve', desc:'Digitales Materialisieren'},
    {n:8, name:'Radial Pulse', desc:'Aufblitzen wie Power-On'},
    {n:9, name:'Corner Unfold', desc:'Entfaltet aus der Ecke'},
    {n:10, name:'Terminal Type-On', desc:'Box zieht auf, Text tippt'}
  ];

  var stage = document.getElementById('stage');
  var hexfield = document.getElementById('hexfield');
  var isOpen = false;
  var hexEls = [];
  var currentAnim = 1;

  var animsEl = document.getElementById('anims');
  ANIMS.forEach(function(a){
    var b = document.createElement('div');
    b.className = 'anim-btn' + (a.n === currentAnim ? ' active' : '');
    b.innerHTML = '<b>' + String(a.n).padStart(2,'0') + ' · ' + a.name + '</b>' + a.desc;
    b.addEventListener('click', function(e){
      e.stopPropagation();
      currentAnim = a.n;
      Array.prototype.forEach.call(animsEl.children, function(el,i){ el.classList.toggle('active', ANIMS[i].n === a.n); });
      stage.setAttribute('data-anim', currentAnim);
      if (isOpen) replay(); else open();
    });
    animsEl.appendChild(b);
  });
  stage.setAttribute('data-anim', currentAnim);

  function buildHexes(){
    if (hexEls.length) return;
    APPS.forEach(function(name, i){
      var h = document.createElement('div');
      h.className = 'hex';
      h.innerHTML = '<div class="hex-face"><div class="hex-inner">' +
        '<div class="idx">' + String(i+1).padStart(2,'0') + '</div>' +
        '<div class="name">' + name + '</div></div></div>';
      hexfield.appendChild(h);
      hexEls.push(h);
    });
  }

  function layout(){
    var w = hexfield.clientWidth, h = hexfield.clientHeight;
    var margin = 24;
    var availW = Math.max(40, w - margin*2), availH = Math.max(40, h - margin*2);
    var n = hexEls.length;

    function capacity(hexW){
      var s = hexW/Math.sqrt(3), hexH = s*2;
      var cols = Math.max(1, Math.floor(availW/hexW));
      var rows = Math.max(1, Math.floor((availH-hexH*0.25)/(hexH*0.75))+1);
      return {cols:cols, rows:rows, hexH:hexH};
    }
    var hexW = 110, cap = capacity(hexW);
    while (cap.cols*cap.rows - Math.floor(cap.rows/2) < n && hexW > 40){ hexW -= 2; cap = capacity(hexW); }
    var cols = cap.cols, rows = cap.rows, hexH = cap.hexH;

    var cells = [];
    for (var row=0; row<rows; row++){
      var rowCols = row%2===0 ? cols : Math.max(0, cols-1);
      for (var col=0; col<rowCols; col++){
        cells.push({ x: col*hexW + (row%2===1 ? hexW/2 : 0), y: row*hexH*0.75 });
      }
    }
    var cx = cells.reduce(function(s,c){return s+c.x;},0)/cells.length;
    var cy = cells.reduce(function(s,c){return s+c.y;},0)/cells.length;
    var ranked = cells.map(function(c){ return {x:c.x, y:c.y, dx:c.x-cx, dy:c.y-cy}; })
      .sort(function(a,b){ return (a.dx*a.dx+a.dy*a.dy) - (b.dx*b.dx+b.dy*b.dy); })
      .slice(0, n);

    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    ranked.forEach(function(p){
      minX=Math.min(minX,p.dx-hexW/2); maxX=Math.max(maxX,p.dx+hexW/2);
      minY=Math.min(minY,p.dy-hexH/2); maxY=Math.max(maxY,p.dy+hexH/2);
    });
    var offsetX = w/2 - (minX+maxX)/2, offsetY = h/2 - (minY+maxY)/2;
    var maxDist = Math.max.apply(null, ranked.map(function(p){ return Math.hypot(p.dx,p.dy); })) || 1;

    hexEls.forEach(function(el, i){
      var p = ranked[i];
      el.style.width = hexW+'px'; el.style.height = hexH+'px';
      el.style.left = (offsetX+p.dx-hexW/2)+'px'; el.style.top = (offsetY+p.dy-hexH/2)+'px';
      var face = el.firstChild;
      var dist = Math.hypot(p.dx,p.dy);
      var baseDelay = (maxDist-dist)/maxDist*350 + (Math.random()*100-50);
      baseDelay = Math.max(0, baseDelay);
      face.style.setProperty('--delay', baseDelay.toFixed(0)+'ms');
      face.style.setProperty('--close-delay', (baseDelay/2).toFixed(0)+'ms');
      face.style.setProperty('--dur', (480+Math.random()*200).toFixed(0)+'ms');
      var cornerX = p.dx < 0 ? '0%' : '100%', cornerY = p.dy < 0 ? '0%' : '100%';
      face.style.setProperty('--corner', cornerX+' '+cornerY);
    });
  }

  function open(){
    buildHexes(); layout();
    stage.classList.remove('closing');
    void stage.offsetWidth;
    stage.classList.add('is-open');
    isOpen = true;
  }
  function closeStage(){
    stage.classList.remove('is-open');
    stage.classList.add('closing');
    isOpen = false;
    setTimeout(function(){ stage.classList.remove('closing'); }, 900);
  }
  function replay(){
    stage.classList.remove('is-open','closing');
    void stage.offsetWidth;
    layout();
    stage.classList.add('is-open');
  }

  stage.addEventListener('click', function(e){
    if (!isOpen){ open(); }
    else if (!e.target.closest('.hex')){ closeStage(); }
  });
  window.addEventListener('resize', function(){ if (isOpen) layout(); });
})();
</script>
</body>
</html>
